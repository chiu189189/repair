<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHIU189 收銀</title>
<meta name="robots" content="noindex">
<!-- 頂端狀態列跟收銀頁同色（收銀頁跟著手機深淺色模式） -->
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<!-- 加入主畫面後全螢幕打開，像 App 一樣 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CHIU189 收銀">
<link rel="apple-touch-icon" href="pos-icon.png">
<link rel="icon" href="pos-icon.png">
<style>
  :root { --bg: #f6f5f2; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121214; --card: #1c1c1f; } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  /* 收銀系統本體（Google Apps Script）放在這個框裡；上面留出瀏海的空間，下面一路到底 */
  iframe {
    position: fixed; border: 0; display: block;
    top: env(safe-area-inset-top); left: env(safe-area-inset-left);
    width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
    height: calc(100vh - env(safe-area-inset-top));
    background: var(--bg);
  }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbx3DCMskoPLo9LdGVBYDY06KbOuc6BI2HGzG2RJVHU2MbfqZloc0F4JMenCG4gSI8yeDQ/exec"
  allow="clipboard-read; clipboard-write" title="CHIU189 收銀"></iframe>
<div id="probe" style="position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top)"></div>
<script>
// iPhone 從主畫面打開時，網頁拿到的高度會少一截（系統毛病），底下就空一條。
// 這裡改用整個螢幕的高度，讓收銀框一路延伸到最底下；底部橫條的留白交給裡面的頁面自己處理。
(() => {
  const f = document.querySelector("iframe"), probe = document.getElementById("probe");
  const fit = () => {
    const top = parseFloat(getComputedStyle(probe).paddingTop) || 0;
    const portrait = matchMedia("(orientation: portrait)").matches;
    const full = navigator.standalone ? (portrait ? screen.height : screen.width) : window.innerHeight;
    f.style.height = Math.max(full, window.innerHeight) - top + "px";
  };
  fit();
  addEventListener("resize", fit);
  addEventListener("orientationchange", () => setTimeout(fit, 300));
})();
</script>
</body>
</html>
