<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-title" content="秘書">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>CHIU189 秘書</title>
<style>
/* 2026-11-10 排版整理：顏色、字級、間距、圓角都從這裡的設定拿，下面的元件不再各寫各的 */
:root {
  --bg: #f4f1ea; --card: #ffffff; --soft: #f1ece2; --ink: #1e1b14; --sub: #6b6458; --mute: #a39b8c; --line: #e6dfd2;
  --accent: #A6843F; --accent-ink: #1E1B14; --gold: #7f6226;
  --ok: #1f8a4c; --fix: #c2410c; --hot: #d4501c; --vid: #3b6fd8;
  --shadow: 0 1px 2px rgba(64, 50, 20, .04), 0 6px 18px rgba(64, 50, 20, .05);
  --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  --t-ok: color-mix(in srgb, var(--ok) 13%, transparent);
  --t-fix: color-mix(in srgb, var(--fix) 12%, transparent);
  --t-hot: color-mix(in srgb, var(--hot) 13%, transparent);
  --t-vid: color-mix(in srgb, var(--vid) 13%, transparent);
  --t-gold: color-mix(in srgb, var(--accent) 16%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14130f; --card: #1d1b16; --soft: #26231d; --ink: #f3efe6; --sub: #a69e8f; --mute: #6f695e; --line: #312d25;
    --accent: #C8A96A; --accent-ink: #1E1B14; --gold: #C8A96A;
    --ok: #3fc47f; --fix: #fb923c; --hot: #ff8552; --vid: #7aa2ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14130f; --card: #1d1b16; --soft: #26231d; --ink: #f3efe6; --sub: #a69e8f; --mute: #6f695e; --line: #312d25;
  --accent: #C8A96A; --accent-ink: #1E1B14; --gold: #C8A96A;
  --ok: #3fc47f; --fix: #fb923c; --hot: #ff8552; --vid: #7aa2ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

/* 基礎 */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:disabled { opacity: .5; cursor: default; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
b, strong { font-weight: 700; }

/* 頂部 */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
.bname { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bname img { width: 36px; height: 36px; border-radius: 10px; flex: none; display: block; }
.brand h1 { font-size: 17px; line-height: 1.25; margin: 0; font-weight: 800; letter-spacing: .02em; }
.brand h1 span { color: var(--gold); }
.bdate { font-size: 12.5px; line-height: 1.3; color: var(--sub); font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 8px; flex: none; }
.icb { width: 42px; height: 42px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--sub); display: grid; place-items: center; font-size: 19px; cursor: pointer; transition: transform .15s; }
.icb:active { transform: scale(.93); }
.icb:disabled { opacity: 1; }
#bell .i-on, #bell.on .i-off { display: none; }
#bell.on { color: var(--gold); background: var(--t-gold); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
#bell.on .i-on { display: block; }
#reload .i-ok { display: none; }
#reload[data-s="load"] .i-re { animation: spin .9s linear infinite; }
#reload[data-s="ok"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
#reload[data-s="ok"] .i-re { display: none; }
#reload[data-s="ok"] .i-ok { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 底部分頁（單手拇指按得到） */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(4, minmax(0, 150px)); justify-content: center; padding: 6px max(8px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-right)); background: var(--card); border-top: 1px solid var(--line); }
.tabs button { position: relative; border: 0; background: none; color: var(--sub); font-size: 11.5px; font-weight: 600; letter-spacing: .04em; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
.tabs .ti-ic { display: grid; place-items: center; width: 56px; height: 30px; border-radius: 999px; font-size: 21px; transition: background-color .2s; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 800; }
.tabs button[aria-selected="true"] .ti-ic { background: var(--t-gold); color: var(--gold); }
.badge { position: absolute; top: 1px; left: calc(50% + 8px); min-width: 19px; height: 19px; line-height: 19px; padding: 0 5px; border-radius: 10px; background: var(--fix); color: #fff; font-size: 11.5px; font-weight: 700; letter-spacing: 0; text-align: center; font-variant-numeric: tabular-nums; }
:root[data-theme="dark"] .badge { color: #1e1b14; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { color: #1e1b14; } }

/* 版面 */
main { padding-top: 16px; padding-bottom: calc(100px + env(safe-area-inset-bottom)); }
.sec { display: flex; align-items: baseline; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--sub); margin: 24px 2px 8px; }
.sec i { font-style: normal; font-weight: 600; letter-spacing: 0; color: var(--mute); font-variant-numeric: tabular-nums; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; margin: 0 0 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 17px; font-weight: 800; line-height: 1.4; margin: 0 0 4px; }
.card.flash { box-shadow: 0 0 0 3px var(--accent); transition: box-shadow .3s; }
.meta { color: var(--sub); font-size: 13.5px; line-height: 1.6; }
.meta b { color: var(--gold); }
.note2 { font-size: 13px; line-height: 1.6; color: var(--sub); margin-top: 8px; }
.msg { font-size: 13.5px; color: var(--sub); margin-top: 8px; }
.msg:empty { display: none; }
.empty { text-align: center; color: var(--sub); padding: 32px 16px; font-size: 14.5px; border: 1px dashed var(--line); border-radius: var(--r-lg); }

/* 小標籤 */
.pill, .tag, .chip, .dl { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; line-height: 1.2; padding: 4px 9px; border-radius: 999px; white-space: nowrap; background: var(--soft); color: var(--sub); }
.pill.img { background: var(--t-gold); color: var(--gold); }
.pill.vid { background: var(--t-vid); color: var(--vid); }
.pill.hot { background: var(--t-hot); color: var(--hot); }
.pill.ok, .tag.ok, .dl.up { background: var(--t-ok); color: var(--ok); }
.pill.bad, .tag.wait, .tag.fix, .dl.down { background: var(--t-fix); color: var(--fix); }
.tag { margin-top: 10px; white-space: normal; line-height: 1.45; border-radius: var(--r-md); }
.chip { font-weight: 600; }

/* 按鈕 */
.btns { display: flex; gap: 8px; margin-top: 12px; }
.btns button { flex: 1; min-width: 0; min-height: 48px; padding: 0 10px; border-radius: var(--r-md); border: 1px solid transparent; background: var(--soft); color: var(--ink); font-weight: 700; font-size: 16px; cursor: pointer; transition: transform .12s; }
.btns button:active:not(:disabled) { transform: scale(.97); }
.btns .okb { flex: 1.5; background: var(--accent); color: var(--accent-ink); }
.btns .ghost { min-height: 42px; background: none; border: 1px dashed var(--line); color: var(--sub); font-size: 14px; font-weight: 600; }
textarea, .datebox input { display: block; width: 100%; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; padding: 12px; margin-top: 12px; }
textarea { min-height: 96px; resize: vertical; }
textarea::placeholder { color: var(--mute); }
textarea:focus, .datebox input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.datebox input { min-height: 48px; }

/* 載入中、提示、警告 */
.state { display: grid; gap: 12px; margin-bottom: 16px; }
.sk { border-radius: var(--r-lg); background: linear-gradient(90deg, var(--soft) 20%, color-mix(in srgb, var(--soft) 50%, var(--card)) 50%, var(--soft) 80%); background-size: 220% 100%; animation: sk 1.3s ease-in-out infinite; }
.sk-h { height: 30px; width: 72%; border-radius: var(--r-sm); margin-top: 4px; }
.sk-s { height: 16px; width: 44%; border-radius: var(--r-sm); margin-bottom: 6px; }
.sk-c { height: 208px; }
.sk-c2 { height: 76px; }
@keyframes sk { from { background-position: 100% 0; } to { background-position: -120% 0; } }
.statebox { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px 16px; text-align: center; font-size: 15px; color: var(--sub); box-shadow: var(--shadow); }
.statebox button { display: block; margin: 14px auto 0; min-height: 46px; padding: 0 24px; border: 0; border-radius: var(--r-md); background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }
.alert, .stale { display: flex; gap: 10px; align-items: flex-start; background: color-mix(in srgb, var(--fix) 9%, var(--card)); border: 1px solid color-mix(in srgb, var(--fix) 32%, var(--line)); border-radius: var(--r-md); padding: 12px 14px; margin-bottom: 14px; font-size: 14px; line-height: 1.55; }
.alert .i, .stale .i { color: var(--fix); font-size: 18px; margin-top: 2px; }
.alert b { display: block; }
.alert small { display: block; font-size: 13px; color: var(--sub); margin-top: 2px; }
.stale:empty, #today:empty { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; width: max-content; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: var(--r-md); font-size: 14.5px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0, 0, 0, .22); }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 800; margin-left: 12px; padding: 4px; cursor: pointer; }

/* 首頁：招呼語 */
.greet { margin: 4px 2px 18px; }
.greet b { display: block; font-size: 24px; font-weight: 800; line-height: 1.3; letter-spacing: -.005em; }
.greet b em { font-style: normal; color: var(--gold); font-variant-numeric: tabular-nums; }
.greet span { display: block; font-size: 14px; color: var(--sub); margin-top: 4px; }
#list > .sec:first-child { margin-top: 0; }

/* 首頁：等你審的稿 */
.act { padding: 14px; }
.act.hot { border-color: color-mix(in srgb, var(--hot) 42%, var(--line)); background: linear-gradient(color-mix(in srgb, var(--hot) 7%, var(--card)), var(--card) 96px); }
.row1 { display: flex; gap: 12px; }
.th { flex: none; width: 84px; height: 105px; border-radius: 10px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.row1 .bd { flex: 1; min-width: 0; }
.kd { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
.kd .due { color: var(--hot); font-weight: 700; }
.act .tt { font-size: 17px; font-weight: 800; line-height: 1.38; margin: 6px 0 4px; overflow-wrap: anywhere; }
.pv { font-size: 13.5px; color: var(--sub); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ckl { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; margin-top: 8px; }
.ckl span { display: inline-flex; align-items: center; gap: 4px; }
.ckl .g { color: var(--ok); font-weight: 600; }
.ckl .w { color: var(--fix); font-weight: 700; }
.linkb { display: block; width: 100%; min-height: 40px; margin-top: 4px; padding: 6px 0 0; border: 0; background: none; color: var(--sub); font-size: 13.5px; cursor: pointer; }
.full { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.full h2 { display: none; }  /* 標題上面已經有了 */
.act:has(.full:not([hidden])) :is(.th, .pv, .ckl) { display: none; }   /* 展開全文時藏縮圖、摘要、查證小結，下面全文都有，不重複 */
.act:has(.full:not([hidden])) > .btns { display: none; }   /* 展開後按鈕在全文最下面，不重複放兩排 */
.imgs { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 12px -14px 0; padding: 0 14px 4px; scrollbar-width: none; }
.imgs::-webkit-scrollbar { display: none; }
.imgs:empty { display: none; }
.imgs img { width: 78%; max-width: 300px; flex: none; border-radius: var(--r-md); scroll-snap-align: center; border: 1px solid var(--line); }
.hint { font-size: 12.5px; color: var(--sub); text-align: right; margin-top: 4px; }
.check { list-style: none; margin: 12px 0 0; padding: 2px 12px; font-size: 14px; line-height: 1.55; background: var(--soft); border-radius: var(--r-md); }
.check:empty { display: none; }
.check li { padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.check li:first-child { border-top: 0; }
.seg { display: flex; gap: 4px; background: var(--soft); border-radius: var(--r-md); padding: 3px; margin-top: 12px; }
.seg button { flex: 1; min-height: 38px; border: 0; background: none; border-radius: 9px; font-size: 14px; font-weight: 700; color: var(--sub); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.capbox { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.65; background: var(--soft); border-radius: var(--r-md); padding: 12px 14px; margin-top: 8px; max-height: 320px; overflow: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chips button { min-height: 38px; padding: 6px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font-size: 14px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

/* 首頁：已處理 */
.card.done { padding: 10px 12px 10px 14px; margin-bottom: 8px; box-shadow: none; }
.dn { display: flex; align-items: center; gap: 12px; }
.dn-ic { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; background: var(--t-ok); color: var(--ok); }
.dn-ic.fix { background: var(--t-fix); color: var(--fix); }
.dn-bd { flex: 1; min-width: 0; }
.dn-t { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dn-s { font-size: 12.5px; color: var(--sub); }
.undo { flex: none; min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: none; color: var(--sub); font-size: 13px; font-weight: 600; cursor: pointer; }

/* 首頁：要你處理、提醒 */
.todo { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 2px 14px; box-shadow: var(--shadow); }
.todo a, .todo button.ti { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 56px; padding: 10px 0; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); font-size: 15px; line-height: 1.45; text-decoration: none; cursor: pointer; }
.todo > :first-child { border-top: 0; }
.todo .ic { flex: none; width: 9px; height: 9px; border-radius: 50%; margin: 0 2px; }
.todo .ic.r { background: var(--fix); } .todo .ic.o { background: #e8a33d; } .todo .ic.y { background: var(--accent); }
.tx { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
.tx small { display: block; font-size: 12.5px; line-height: 1.5; color: var(--sub); font-weight: 400; }
.go { flex: none; display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--sub); white-space: nowrap; }
.todo .go { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 7px 12px; border-radius: 999px; }
.remind { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--soft); border: 0; border-radius: var(--r-lg); padding: 12px 14px; color: var(--ink); cursor: pointer; }
.remind .rm-ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: var(--card); color: var(--gold); }
.remind .tx b { display: block; font-size: 15px; }

/* 行程 */
.dayhd { display: flex; align-items: center; gap: 8px; margin: 24px 2px 8px; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
.dayhd:first-child { margin-top: 2px; }
.dayhd small { font-size: 13px; font-weight: 600; color: var(--sub); }
.list { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); }
.it { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.it:first-child { border-top: 0; }
.it .bd { flex: 1; min-width: 0; }
.it.done .mth, .it.done .tt { opacity: .55; }
.mth { flex: none; width: 56px; height: 70px; border-radius: 10px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-size: 22px; color: var(--mute); }
.mth img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mtm { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mtt { font-size: 15px; line-height: 1.45; margin-top: 3px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pl { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12.5px; color: var(--sub); margin-top: 5px; }
.pl span { display: inline-flex; align-items: center; gap: 3px; }
.pl .good, .ck-ok { color: var(--ok); font-weight: 600; }
.pl .bad, .ck-bad { color: var(--fix); font-weight: 700; }
.more { width: 100%; min-height: 46px; margin-top: 14px; border: 1px dashed var(--line); border-radius: var(--r-md); background: none; color: var(--sub); font-size: 14px; cursor: pointer; }

/* 成效：每張卡同一套格式＝標題列 → 大數字 → 一句說明 → 明細列 */
.sc { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px 4px; margin-bottom: 12px; box-shadow: var(--shadow); }
.sc-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; }
.sc-t { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 15px; font-weight: 700; }
.sc-ic { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; background: var(--t-gold); color: var(--gold); }
.sc-big { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.sc-big b { font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: -.015em; font-variant-numeric: tabular-nums; }
.sc-big i { font-style: normal; font-size: 15px; font-weight: 600; color: var(--sub); }
.sc-big .dl { align-self: center; margin-left: 4px; font-size: 12.5px; }
.sc-desc { font-size: 13px; color: var(--sub); margin: 2px 0 10px; }
.sr { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.sl { flex: 1; min-width: 0; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
.sl small, .sv small { display: block; font-size: 12.5px; color: var(--sub); font-weight: 400; margin-top: 1px; }
.sv { text-align: right; font-size: 15px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sr.link .sl { display: flex; gap: 8px; }
.sr.link .sl span:last-child { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rk { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 6px; background: var(--soft); color: var(--gold); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.sc-foot { font-size: 12px; color: var(--sub); padding: 9px 0 8px; border-top: 1px solid var(--line); }
.sc.tips { background: color-mix(in srgb, var(--accent) 9%, var(--card)); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); padding-bottom: 12px; box-shadow: none; }
.tip { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.5; margin-top: 8px; }
.tip .i { color: var(--gold); font-size: 16px; margin: 3px 7px 0; }
.mini { margin-left: 8px; padding: 4px 9px; border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--line)); border-radius: var(--r-sm); background: none; color: var(--gold); font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer; }
/* 客人在查什麼 */
.seg2 { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 2px; }
.seg2 button { min-height: 28px; padding: 3px 11px; border: 0; border-radius: 999px; background: none; font-size: 12.5px; font-weight: 700; color: var(--sub); cursor: pointer; }
.seg2 button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.qdays, .wdays { display: flex; align-items: flex-end; gap: 3px; height: 76px; margin: 12px 0 6px; }
.qdays div, .wdays div { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.qdays i, .wdays i { display: block; flex: none; min-height: 2px; width: 100%; background: color-mix(in srgb, var(--accent) 78%, transparent); border-radius: 3px 3px 0 0; }
.qdays span, .wdays span { font-size: 10.5px; color: var(--sub); margin-top: 4px; white-space: nowrap; height: 14px; font-variant-numeric: tabular-nums; }
.wdays { gap: 6px; }
.qsteps { display: flex; align-items: stretch; gap: 2px; margin: 8px 0 6px; }
.qs { flex: 1; min-width: 0; background: var(--soft); border-radius: 10px; padding: 9px 4px; text-align: center; }
.qs b { display: block; font-size: 20px; font-weight: 800; line-height: 1.3; font-variant-numeric: tabular-nums; }
.qs span { display: block; font-size: 11.5px; color: var(--sub); line-height: 1.3; }
.qs small { display: block; font-size: 11.5px; color: var(--gold); font-weight: 700; }
.qa { font-style: normal; color: var(--mute); align-self: center; font-size: 14px; }
.qh { font-size: 14px; font-weight: 700; margin: 14px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.qh small { display: block; font-weight: 400; font-size: 12.5px; color: var(--sub); }
.qb { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; }
.qk { width: 38%; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qbar { flex: 1; height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.qv { width: 46px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13.5px; }
.qmiss { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; }
.qmiss span { background: var(--t-fix); color: var(--fix); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
/* 看詳細數據（收合） */
details.fold { padding: 0 16px; }
details.fold > summary { display: flex; align-items: center; min-height: 54px; cursor: pointer; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { margin: 0; font-size: 16px; }
details.fold > summary::after { content: "展開"; margin-left: auto; font-size: 13px; color: var(--sub); }
details.fold[open] > summary::after { content: "收起"; }
details.fold[open] { padding-bottom: 14px; }
details.fold details.fold { background: var(--soft); border-color: transparent; box-shadow: none; margin: 8px 0 0; padding: 0 14px; }
details.fold details.fold[open] { padding-bottom: 12px; }
details.fold details.fold .kpi { background: var(--card); }
details.fold details.fold .bar { background: var(--card); }
.sum { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0 0; }
.sum-n { margin: 8px 2px 14px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(min-content, 1fr)); gap: 8px; margin: 12px 0 6px; }
.kpi { background: var(--soft); border-radius: var(--r-md); padding: 10px 11px; min-width: 0; }
.kpi b { display: block; font-size: clamp(18px, 5.4vw, 22px); font-weight: 800; line-height: 1.25; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kpi small { display: block; font-size: 11.5px; }
.kpi .st { font-style: normal; font-size: .72em; color: var(--gold); margin-left: 2px; vertical-align: 2px; }
.kpi span { font-size: 12.5px; line-height: 1.4; color: var(--sub); }
.kpi .w { color: var(--fix); font-weight: 700; }
.dlt { font-size: 12.5px; font-weight: 700; margin-left: 5px; }
.dlt.up { color: var(--ok); } .dlt.down { color: var(--fix); } .dlt.flat { color: var(--sub); font-weight: 400; }
.meta .live { color: var(--ok); }
.sub-h { font-size: 13px; font-weight: 700; color: var(--sub); margin: 16px 0 4px; }
.tp { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.sub-h + .tp { border-top: 0; }
.tp > div { flex: 1; min-width: 0; }
.tp a { color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.tp small { display: block; font-size: 12px; color: var(--sub); }
.tp .v { min-width: 4.6em; text-align: right; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--soft); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 12px; font-weight: 600; color: var(--sub); text-align: right; padding: 2px 0 5px 8px; }
.tbl td { padding: 7px 0 7px 8px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; line-height: 1.25; font-weight: 600; }
.tbl td:first-child { width: 36%; padding-left: 0; text-align: left; white-space: normal; font-size: 13.5px; font-weight: 400; line-height: 1.35; }
.tbl td small { display: block; font-size: 11px; font-weight: 400; color: var(--sub); }
.tbl .few { color: var(--mute); font-weight: 400; }
.tbl .best { color: var(--gold); font-weight: 800; }
.best .i { font-size: 12px; margin-right: 3px; vertical-align: -1px; fill: currentColor; }
.note2 .best { color: var(--gold); }

/* 問我 */
.req { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
.req .q { font-weight: 700; overflow-wrap: anywhere; }
.req .a { margin-top: 10px; padding: 10px 12px; background: var(--soft); border-radius: var(--r-md); font-size: 14.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.req .s { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--sub); margin-top: 10px; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap brand">
    <div class="bname"><img src="icon.png" alt="" width="36" height="36"><div><h1><span>CHIU189</span> 秘書</h1><div class="bdate" id="hdate"></div></div></div>
    <div class="tools">
      <button id="bell" class="icb" type="button" aria-label="手機通知">
        <svg class="i i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>
        <svg class="i i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>
      <button id="reload" class="icb" type="button" aria-label="重新整理">
        <svg class="i i-re" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        <svg class="i i-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="upd" class="stale"></div>
  <div id="state" class="state" aria-label="載入中"><div class="sk sk-h"></div><div class="sk sk-s"></div><div class="sk sk-c"></div><div class="sk sk-c2"></div></div>
  <div id="today"></div>
  <section class="pane" id="pane-review"><div id="greet" class="greet"></div><div id="list"></div><div id="todo"></div><div id="done"></div></section>
  <section class="pane" id="pane-sched" hidden><div id="sched"></div></section>
  <section class="pane" id="pane-stats" hidden><div id="stats"></div></section>
  <section class="pane" id="pane-ask" hidden>
    <div class="card"><h2>有事問我</h2><div class="meta">想改排程、問成效、指定下一篇題目…打一句話就好。通常 15 分鐘內回覆（比較複雜的會等到 12:20、20:40），結果會傳 LINE 也會顯示在下面。</div>
      <textarea id="askText" placeholder="例如：下一篇做 iOS 27.2 耗電／11/5 的影片改到 11/6／這週哪篇最多人看？"></textarea>
      <div class="btns"><button type="button" class="okb" id="askSend">送出</button></div><div class="msg" id="askMsg"></div></div>
    <div id="askList"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<nav class="tabs" role="tablist" aria-label="分頁">
  <button type="button" role="tab" data-tab="review" aria-selected="true"><span class="ti-ic" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>首頁<span class="badge" id="badge" hidden></span></button>
  <button type="button" role="tab" data-tab="sched" aria-selected="false"><span class="ti-ic" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>行程</button>
  <button type="button" role="tab" data-tab="stats" aria-selected="false"><span class="ti-ic" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V7M18 17v-8"/></svg></span>成效</button>
  <button type="button" role="tab" data-tab="ask" aria-selected="false"><span class="ti-ic" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>問我</button>
</nav>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwcStF05qkS0cKT8l6PoTTzj21ijwnnyyJkoSDqPYZjDxFVG6EadZCwCp2GrKpV7wNSow/exec';
const $ = (s) => document.querySelector(s);
// 線條圖示（取代原本的表情符號，深淺色都跟著文字顏色走）
const ICON = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  doc: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h6M8 13h8M8 17h5"/>',
  video: '<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  ext: '<path d="M7 17 17 7M8 7h9v9"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
  mega: '<path d="m3 11 18-5v12L3 14z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20z"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/>',
  star: '<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2L5.8 21 7 14.2 2 9.3l6.9-1z"/>',
};
const ic = (k) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[k] || ''}</svg>`;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = '日一二三四五六';
const clean = (t) => String(t || '').replace(/[【】]/g, ' ').replace(/\s+/g, ' ').trim();
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
let data = { reviews: [], decisions: {} }, showAll = false;
const setDate = () => { const d = new Date(); $('#hdate').textContent = `${d.getMonth() + 1}月${d.getDate()}日 週${WD[d.getDay()]}`; };
setDate();
// 最上面的狀態區：第一次載入的骨架、要輸入密碼、讀不到資料
function stateMsg(t, btn) { const s = $('#state'); s.hidden = false; s.removeAttribute('aria-label'); s.innerHTML = `<div class="statebox">${esc(t)}${btn ? `<button type="button" onclick="load()">${btn}</button>` : ''}</div>`; }

function getPin() { try { return localStorage.getItem('chiu189_pin') || ''; } catch (e) { return ''; } }
function setPin(v) { try { localStorage.setItem('chiu189_pin', v); } catch (e) {} }
function askPin() { const v = prompt('請輸入審稿密碼（只要輸入一次）'); if (v) setPin(v.trim()); return v ? v.trim() : ''; }
const sched = () => (data.reviews || []).find((r) => r.id === '__schedule__') || {};
const reviews = () => (data.reviews || []).filter((r) => r.id !== '__schedule__');

function setTab(t) {
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  ['review', 'sched', 'stats', 'ask'].forEach((k) => { $('#pane-' + k).hidden = k !== t; });
  $('#today').hidden = t !== 'sched' || !$('#today').dataset.has;
  try { sessionStorage.setItem('chiu189_tab', t); } catch (e) {}
  if (t === 'ask' && !askLoaded) { askLoaded = true; loadAsk(); }
}

let firstLoad = true, loading = false, lastLoad = 0;
async function load(quiet) {
  if (loading) return; loading = true;
  const btn = $('#reload'); btn.dataset.s = 'load'; btn.disabled = true; setDate();
  try {
    let r;
    // 2026-11-10：讀稿也要密碼（PIN 存在這支手機，只輸入一次）
    let pin = getPin() || askPin();
    if (!pin) { stateMsg('要輸入審稿密碼才看得到內容。', '輸入密碼'); throw new Error('nopin'); }
    const post = () => fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: 'list', pin }) });
    try { r = await post(); } catch (e1) { await new Promise((ok) => setTimeout(ok, 1500)); r = await post(); }
    const j = await r.json();
    if (!j.ok) {
      if (j.error === 'pin') { setPin(''); stateMsg('密碼不對，請重新輸入。', '輸入密碼'); throw new Error('pin'); }
      if (j.error === 'locked') { stateMsg('密碼錯太多次，鎖定 1 小時，請稍後再試。'); throw new Error('locked'); }
      throw new Error(j.error);
    }
    data = j;
    $('#state').hidden = true; $('#state').innerHTML = '';
    render();
    const s = sched();
    const age = s.updated ? (Date.now() - new Date(s.updated).getTime()) / 6e4 : 0;   // 行程資料多久沒更新（分鐘）
    $('#upd').innerHTML = age > 60 ? `${ic('alert')}<span>行程資料 ${age > 180 ? Math.round(age / 60) + ' 小時' : Math.round(age) + ' 分鐘'}沒更新了，店裡的電腦可能關機或睡眠</span>` : '';
    let saved = ''; try { saved = sessionStorage.getItem('chiu189_tab') || ''; } catch (e) {}
    const waiting = reviews().filter((x) => !(data.decisions || {})[x.id]).length;
    if (firstLoad) { setTab(saved || 'review'); firstLoad = false; }
    else { const cur = document.querySelector('.tabs button[aria-selected="true"]'); setTab(cur ? cur.dataset.tab : 'review'); if (cur && cur.dataset.tab === 'ask') loadAsk(); }
    lastLoad = Date.now();
    if (location.hash.length > 1 && !load._jumped) { load._jumped = true; setTab('review'); const el = document.getElementById('c-' + decodeURIComponent(location.hash.slice(1))); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2500); } }
    btn.dataset.s = 'ok';
    setTimeout(() => { if (btn.dataset.s === 'ok') btn.dataset.s = ''; }, 1500);
  } catch (e) {
    btn.dataset.s = '';
    if (!['nopin', 'pin', 'locked'].includes(e.message)) { if (firstLoad) stateMsg('讀不到資料，可能是網路不穩。', '再試一次'); else if (!quiet) toast('讀不到最新資料，請稍後再按右上角的重新整理'); }
  }
  btn.disabled = false; loading = false;
}

function render() { renderToday(); renderReview(); renderTodo(); renderSched(); renderStats(); }


function toast(t, undo) {
  const el = $('#toast'); el.textContent = t; el.hidden = false;
  if (undo) { const b = document.createElement('button'); b.type = 'button'; b.textContent = '復原'; b.onclick = () => { el.hidden = true; undo(); }; el.appendChild(b); }
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, undo ? 6000 : 3500);
}

// ① 待辦：所有要你動手的事集中在這裡
function renderTodo() {
  const items = sched().schedule || [], st = sched().stats || {}, rv = reviews();
  const now = new Date(), tk = dayKey(now), out = [];
  const md = (k) => { const d = new Date(k + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`; };
  const waiting = rv.filter((x) => !(data.decisions || {})[x.id]).length;
  todoN = out.length;
  const g = st.gbp;

function hotExpire(id) {
  const m = /^hot-(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(id || ''); if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  if (d.getHours() >= 22 || d.getHours() < 7) { const e = new Date(d); if (d.getHours() >= 22) e.setDate(e.getDate() + 1); e.setHours(10, 0, 0, 0); return e; }
  return new Date(d.getTime() + 6 * 3600e3);
}

  const pin = getPin() || askPin();
  if (!pin) return;
  const msg = card.querySelector(':scope > .msg') || card.querySelector('.msg');
  card.querySelectorAll('button').forEach((b) => (b.disabled = true));
  msg.textContent = '存檔中…';
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: 'decide', id: r.id, decision, note: note || '', pin }) });
    const j = await res.json();
    if (!j.ok && j.error === 'pin') { setPin(''); msg.textContent = '密碼不對，請再按一次重新輸入。'; card.querySelectorAll('button').forEach((b) => (b.disabled = false)); return; }
    if (!j.ok) throw new Error(j.error);
    if (decision === 'clear') delete data.decisions[r.id]; else data.decisions[r.id] = { decision, note: note || '' };
    renderToday(); renderReview(); renderTodo();
    const idx = card.dataset.i;
    if (decision === 'ok' || decision === 'fix') toast(decision === 'ok' ? ((r.id || '').startsWith('hot-') ? '✅ 已通過，5 分鐘內發 Threads' : '✅ 已通過，會自動排程') : (note === '熱議不發' ? '好，這篇不發' : '意見收到，Claude 改好會傳 LINE'), () => { const c = document.querySelector(`.card[data-i="${idx}"]`); if (c) decide(c, 'clear'); });
    else toast('已復原');
  } catch (e) { msg.textContent = '沒存到，請再按一次。'; card.querySelectorAll('button').forEach((b) => (b.disabled = false)); }
}

$('#list').addEventListener('click', (e) => {
  const cb = e.target.closest('button[data-cap]');
  if (cb) { const card = cb.closest('.card'), r = reviews()[+card.dataset.i]; card.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === cb))); card.querySelector('.capbox').textContent = (r.caps || {})[cb.dataset.cap] || ''; return; }
  const ch = e.target.closest('button[data-chip]');
  if (ch) { const ta = ch.closest('.fixbox').querySelector('textarea'), on = ch.getAttribute('aria-pressed') !== 'true', c = ch.dataset.chip; ch.setAttribute('aria-pressed', String(on)); const parts = ta.value.split('、').map((x) => x.trim()).filter(Boolean).filter((x) => x !== c); if (on) parts.push(c); ta.value = parts.join('、'); return; }
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const card = b.closest('.card'), act = b.dataset.act, box = card.querySelector('.fixbox');
  if (act === 'toggle') { const f = card.querySelector('.full'); f.hidden = !f.hidden; b.textContent = f.hidden ? b.dataset.l + ' ›' : '收起全文'; return; }
  if (act === 'fixopen') { const f = card.querySelector('.full'); f.hidden = false; card.querySelector('[data-act="toggle"]').textContent = '收起全文'; if (box) { box.hidden = false; const dd = card.querySelector('.datebox'); if (dd) dd.hidden = true; box.querySelector('textarea').focus(); } return; }
  const dbox = card.querySelector('.datebox');
  if (act === 'ok') decide(card, 'ok');
  else if (act === 'fix') { if (dbox) dbox.hidden = true; box.hidden = false; box.querySelector('textarea').focus(); }
  else if (act === 'date') { box.hidden = true; dbox.hidden = false; }
  else if (act === 'okdate') { const v = dbox.querySelector('input').value; if (!v) { dbox.querySelector('input').focus(); return; } decide(card, 'ok', '日期:' + v); }
  else if (act === 'cancel') { box.hidden = true; if (dbox) dbox.hidden = true; }
  else if (act === 'sendfix') { const t = box.querySelector('textarea').value.trim(); if (!t) { box.querySelector('textarea').focus(); return; } decide(card, 'fix', t); }
  else if (act === 'clear') decide(card, 'clear');
  else if (act === 'hotno') decide(card, 'fix', '熱議不發');
});
$('#stats').addEventListener('click', async (e) => {
  const q = e.target.closest('button[data-qr]');
  if (q) { try { localStorage.setItem('chiu189_qr', q.dataset.qr); } catch (err) {} renderStats(); return; }
  const b = e.target.closest('button[data-topic]'); if (!b) return;
  e.preventDefault();
  const topic = b.dataset.topic.replace('｜', ' ');
  if (!confirm(`把「${topic}」設成下一篇貼文的題目？`)) return;
  b.disabled = true;
  try { const j = await askApi({ a: 'ask', text: `【下一篇題目】${topic}（報價頁很多人想修）` }); if (j) { b.textContent = '✓ 已指定'; toast('收到！15 分鐘內排進下一篇，晚上 8:10 做稿會用這題。'); } else b.disabled = false; }
  catch (err) { b.disabled = false; toast(err.message === 'pin' ? '密碼不對，請再按一次。' : '沒送出去，請再按一次。'); }
});
$('#sched').addEventListener('click', (e) => { if (e.target.id === 'more') { showAll = true; renderSched(); } });
document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) { setTab(b.dataset.tab); window.scrollTo({ top: 0 }); } });
async function askApi(body) {
  const pin = getPin() || askPin(); if (!pin) return null;
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pin }, body)) });
  const j = await res.json();
  if (!j.ok && j.error === 'pin') { setPin(''); throw new Error('pin'); }
  if (!j.ok) throw new Error(j.error);
  return j;
}
function renderAsk(list) {
  const st = { new: ['等處理', ''], done: ['已處理', 'ok'], need_you: ['要你處理', 'bad'] };
  $('#askList').innerHTML = (list || []).map((q) => { const [lab, cls] = st[q.status] || [q.status, '']; return `<div class="req"><div class="q">${esc(q.text)}</div>${q.reply ? `<div class="a">${esc(q.reply)}</div>` : ''}<div class="s"><span>${new Date(q.at).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })}</span><span class="pill ${cls}">${esc(lab)}</span></div></div>`; }).join('') || '<div class="empty">還沒有問過問題</div>';
}
async function loadAsk() {
  $('#askList').innerHTML = '<div class="empty">載入中…</div>';
  try { const j = await askApi({ a: 'my_requests' }); if (j) renderAsk(j.requests); else $('#askList').innerHTML = '<div class="empty">輸入審稿密碼後才看得到</div>'; }
  catch (e) { $('#askList').innerHTML = e.message === 'pin' ? '<div class="empty">密碼不對，切換分頁再試一次</div>' : '<div class="empty">讀不到，請稍後再試</div>'; }
}
$('#askSend').addEventListener('click', async () => {
  const t = $('#askText').value.trim(); if (!t) { $('#askText').focus(); return; }
  $('#askSend').disabled = true; $('#askMsg').textContent = '送出中…';
  try { const j = await askApi({ a: 'ask', text: t }); if (j) { $('#askText').value = ''; $('#askMsg').textContent = '收到！通常 15 分鐘內回覆，結果會傳 LINE。'; renderAsk(j.requests); } else $('#askMsg').textContent = ''; }
  catch (e) { $('#askMsg').textContent = e.message === 'pin' ? '密碼不對，請再按一次。' : '沒送出去，請再按一次。'; }
  $('#askSend').disabled = false;
});
let askLoaded = false;
$('#reload').addEventListener('click', () => load());
// 像 APP：切回這個畫面就自動更新；開著的時候每 5 分鐘更新一次
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastLoad > 30000) load(true); });
setInterval(() => { if (!document.hidden) load(true); }, 5 * 60 * 1000);
load();

// 🔔 手機通知（2026-11-05）：取代 LINE 秘書。iPhone 要先「加入主畫面」再從圖示打開
const VKEY = 'BLhs0DJUE33sMiuIRjj2soT-aUv_vdtW3cdyiIPmvblvO-Ze0STOGeTNL3GMBRmfIBC3vI5y11X1QyTTRH-gAkA';
const bell = $('#bell'), canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent), standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
let swReg = null;
const b64key = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); };
const setBell = (on) => bell.classList.toggle('on', on);
async function saveSub(sub, a) { const pin = getPin() || askPin(); if (!pin) throw new Error('nopin'); const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: a || 'push_sub', pin, sub: sub.toJSON() }) }); const j = await res.json(); if (!j.ok && j.error === 'pin') { setPin(''); throw new Error('pin'); } if (!j.ok) throw new Error(j.error); }
if (canPush) {
  swReg = navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready);
  swReg.then((r) => r.pushManager.getSubscription()).then((sub) => { if (sub && Notification.permission === 'granted') { setBell(true); if (getPin()) saveSub(sub).catch(() => {}); } }).catch(() => {});
}
bell.addEventListener('click', async () => {
  if (/Line\//.test(navigator.userAgent)) return alert('LINE 裡面沒辦法開通知，請按右上角「⋯」→ 用預設瀏覽器開啟，再按 🔔。');
  if (isIOS && !standalone) return alert('iPhone 要先加到主畫面：\n1. 用 Safari 打開這頁\n2. 按下方「分享」⬆︎\n3. 選「加入主畫面」\n4. 從主畫面的 CHIU189 審稿 圖示打開，再按 🔔');
  if (!canPush) return alert('這個瀏覽器不支援通知，請用 iPhone 主畫面圖示或 Chrome 打開。');
  try {
    const r = await swReg;
    let sub = await r.pushManager.getSubscription();
    if (bell.classList.contains('on') && sub) {
      if (!confirm('要關掉手機通知嗎？')) return;
      await saveSub(sub, 'push_unsub').catch(() => {}); await sub.unsubscribe(); setBell(false); return toast('已關掉通知');
    }
    const p = await Notification.requestPermission();
    if (p !== 'granted') return alert('通知被關掉了：請到 iPhone「設定 → 通知 → CHIU189 審稿」打開，再按一次 🔔。');
    sub = sub || await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64key(VKEY) });
    await saveSub(sub); setBell(true); toast('已開啟！有新稿、排程結果會直接通知你 🔔');
  } catch (e) { toast(e.message === 'pin' ? '密碼不對，請再按一次 🔔' : e.message === 'nopin' ? '要輸入審稿密碼才能開通知' : '沒開成功，請再按一次 🔔'); }
});
