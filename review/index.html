<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-title" content="秘書">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>CHIU189 秘書</title>
<style>
:root {
  --bg: #f4f1ea; --card: #ffffff; --soft: #f1ece2; --ink: #1e1b14; --sub: #6b6458; --line: #e6dfd2;
  --accent: #A6843F; --accent-ink: #1E1B14; --ok: #1f8a4c; --fix: #c2410c; --img: #A6843F; --vid: #3b6fd8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14130f; --card: #1d1b16; --soft: #26231d; --ink: #f3efe6; --sub: #a69e8f; --line: #312d25;
    --accent: #C8A96A; --accent-ink: #1E1B14; --ok: #3fc47f; --fix: #fb923c; --img: #C8A96A; --vid: #7aa2ff;
  }
}
:root[data-theme="dark"] {
  --bg: #14130f; --card: #1d1b16; --soft: #26231d; --ink: #f3efe6; --sub: #a69e8f; --line: #312d25;
  --accent: #C8A96A; --accent-ink: #1E1B14; --ok: #3fc47f; --fix: #fb923c; --img: #C8A96A; --vid: #7aa2ff;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

/* 頂部：標題＋分頁（捲動時固定） */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 0 10px; }
.brand h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
.brand h1 span { color: var(--accent); }
.brand .tools { display: flex; align-items: center; gap: 4px; }
#bell { font-size: 17px !important; padding: 4px 8px !important; border-radius: 999px; opacity: .45; filter: grayscale(1); }
#bell.on { opacity: 1; filter: none; }
.brand button { background: none; border: 0; color: var(--sub); font: inherit; font-size: 13px; padding: 6px 0 6px 8px; cursor: pointer; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--soft); border-radius: 12px; padding: 4px; margin-bottom: 10px; }
.tabs button { border: 0; background: none; color: var(--sub); font: inherit; font-weight: 700; font-size: 15px; min-height: 40px; border-radius: 9px; cursor: pointer; position: relative; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
/* 2026-11-07 分頁列移到畫面最下面（單手拇指按得到） */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; margin: 0; border-radius: 0; gap: 0; padding: 6px max(8px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-right)); background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.tabs button { min-height: 52px; font-size: 12.5px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.tabs button .ti-ic { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .6; }
.tabs button[aria-selected="true"] { background: none; box-shadow: none; color: var(--accent); }
.tabs button[aria-selected="true"] .ti-ic { filter: none; opacity: 1; }
.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); margin: 0; }
/* 圖文／影片改用圖示，不再用顏色點 */
.dot { width: auto !important; height: auto !important; background: none !important; border-radius: 0 !important; font-size: 13px; vertical-align: 0 !important; }
.dot.img::before { content: '📝'; } .dot.vid::before { content: '🎬'; }
/* 要你處理 vs 提醒 */
.todo.act a, .todo.act button.ti { font-weight: 600; }
.todo.act .go { background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 6px 12px; border-radius: 999px; font-size: 13.5px; }
.mini3 .it { align-items: center; }
#sched .it { align-items: center; }
#sched .it.done .mth { opacity: .6; }
.mth { width: 60px; height: 60px; flex: none; border-radius: 10px; overflow: hidden; background: var(--soft); display: grid; place-items: center; font-size: 24px; }
.mth img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mtm { font-size: 12.5px; font-weight: 700; color: var(--sub); font-variant-numeric: tabular-nums; }
.mtt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
/* 成效卡（2026-11-07 排版整理） */
.sc { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 6px; margin-bottom: 10px; }
.sc-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14.5px; font-weight: 700; color: var(--sub); }
.chip { font-size: 12px; font-weight: 600; color: var(--sub); background: var(--soft); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.sc-big { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.sc-big b { font-size: 34px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.sc-big i { font-style: normal; font-size: 15px; font-weight: 600; color: var(--sub); }
.dl { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--sub); margin-left: 2px; white-space: nowrap; }
.dl.up { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.dl.down { color: var(--fix); background: color-mix(in srgb, var(--fix) 12%, transparent); }
.sc-desc { font-size: 13px; color: var(--sub); margin: 2px 0 6px; }
.sr { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.sl { flex: 1; min-width: 0; font-size: 15px; line-height: 1.4; }
.sl small, .sv small { display: block; font-size: 12.5px; color: var(--sub); font-weight: 400; margin-top: 1px; }
.sv { text-align: right; font-size: 15px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sr.link .sl { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rk { display: inline-block; width: 20px; color: var(--accent); font-weight: 800; }
.sc-foot { font-size: 12px; color: var(--sub); padding: 8px 0 6px; border-top: 1px solid var(--line); }
.sc.tips { background: var(--soft); border-color: transparent; padding-bottom: 10px; }
.tip { display: flex; gap: 8px; align-items: baseline; font-size: 15px; line-height: 1.5; margin-top: 6px; }
.tip .ti { flex: none; width: 20px; text-align: center; }
.vchips { display: flex; flex-wrap: wrap; gap: 8px; }
.vchips button { border: 1px solid var(--line); background: var(--soft); color: var(--ink); font: inherit; font-size: 14.5px; padding: 8px 12px; border-radius: 999px; cursor: pointer; min-height: 40px; }
.vchips button b { color: var(--accent); margin-left: 2px; }
.vchips button:active { transform: scale(.96); }
.remind { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--soft); border: 0; border-radius: 12px; padding: 10px 14px; margin: 0 0 8px; color: var(--sub); font: inherit; font-size: 14px; cursor: pointer; }
.remind .tx { flex: 1; min-width: 0; }
.remind .go { font-size: 13px; flex: none; }
.funnel .f small { display: block; font-size: 11.5px; color: var(--sub); margin-top: 1px; }
.foot .warn { color: var(--fix); font-weight: 700; }
main.wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.todo > a:first-child, .todo > button.ti:first-child { border-top: 0; }
.badge { display: inline-block; min-width: 20px; height: 20px; line-height: 20px; border-radius: 10px; background: var(--fix); color: #fff; font-size: 12px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }

main { padding: 14px 0 calc(96px + env(safe-area-inset-bottom)); }
.pane[hidden] { display: none; }

/* 今日摘要 */
.today { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
.today .hd { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
.today .row { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; font-size: 15px; }
.today .row .tm { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 44px; }
.today .row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today .none { color: var(--sub); font-size: 15px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }
.dot.img { background: var(--img); } .dot.vid { background: var(--vid); }

/* 卡片 */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 14px; }
.card h2 { font-size: 18px; margin: 0 0 4px; line-height: 1.45; }
.meta { color: var(--sub); font-size: 14px; }
.meta b { color: var(--accent); }
.tag { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 2px 10px; margin: 8px 0 2px; }
.tag.wait { background: color-mix(in srgb, var(--fix) 15%, transparent); color: var(--fix); }
.tag.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.tag.fix { background: color-mix(in srgb, var(--fix) 15%, transparent); color: var(--fix); }
.imgs { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 12px -16px; padding: 0 16px 4px; scrollbar-width: none; }
.imgs::-webkit-scrollbar { display: none; }
.imgs img { width: 80%; max-width: 320px; flex: none; border-radius: 10px; scroll-snap-align: center; border: 1px solid var(--line); }
.hint { font-size: 12.5px; color: var(--sub); text-align: right; margin-top: -6px; }
.check { margin: 10px 0; padding: 0; list-style: none; font-size: 14.5px; }
.check li { padding: 4px 0; border-top: 1px dashed var(--line); }
.check li:first-child { border-top: 0; }
details { border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; background: var(--soft); }
summary { cursor: pointer; padding: 10px 12px; font-weight: 700; min-height: 44px; display: flex; align-items: center; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "展開"; margin-left: auto; font-size: 13px; font-weight: 400; color: var(--sub); }
details[open] summary::after { content: "收起"; }
details pre { white-space: pre-wrap; word-break: break-word; margin: 0; padding: 0 12px 12px; font: inherit; font-size: 15px; }
.btns { display: flex; gap: 10px; margin-top: 12px; }
.btns button { flex: 1; min-height: 50px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; border: 1px solid var(--line); background: var(--soft); color: var(--ink); }
.btns .okb { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btns .ghost { background: none; font-size: 14px; min-height: 40px; color: var(--sub); border-style: dashed; }
.btns button:disabled { opacity: .5; }
textarea { width: 100%; min-height: 90px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; padding: 10px; margin-top: 10px; }
.msg { font-size: 14px; color: var(--sub); margin-top: 8px; }
.msg:empty { display: none; }
.empty { text-align: center; color: var(--sub); padding: 28px 12px; font-size: 15px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }

/* 行程 */
.dayhd { font-size: 14px; font-weight: 700; color: var(--sub); margin: 16px 2px 6px; display: flex; gap: 8px; align-items: center; }
.dayhd.is-today { color: var(--accent); }
.dayhd:first-child { margin-top: 0; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.it { display: flex; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: flex-start; }
.it:first-child { border-top: 0; }
.it .tm { font-weight: 700; min-width: 44px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.it .bd { flex: 1; min-width: 0; }
.it .tt { font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.it .pl { font-size: 12.5px; color: var(--sub); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.it .pl .bad { color: var(--fix); font-weight: 700; }
.it .pl .good { color: var(--ok); }
.it.done { opacity: .5; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--sub); margin: 0 2px 10px; }
.more { width: 100%; margin-top: 12px; min-height: 44px; border-radius: 12px; border: 1px dashed var(--line); background: none; color: var(--sub); font: inherit; cursor: pointer; }

/* 成效 */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0 6px; }
.kpi { background: var(--soft); border-radius: 12px; padding: 10px; }
.kpi b { display: block; font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--sub); }
.note2 { font-size: 13.5px; color: var(--sub); margin-top: 6px; }
.tp { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.tp:first-of-type { border-top: 0; }
.tp a { color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.tp .v { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--soft); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.sub-h { font-size: 13px; color: var(--sub); margin: 12px 0 2px; }
.ck-ok { color: var(--ok); } .ck-bad { color: var(--fix); font-weight: 700; }
.alert { background: color-mix(in srgb, var(--fix) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--fix) 40%, transparent); color: var(--ink); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 14.5px; }
.req { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.req .q { font-weight: 700; overflow-wrap: anywhere; }
.req .a { margin-top: 6px; font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.req .s { font-size: 12.5px; color: var(--sub); margin-top: 4px; }

/* 2026-11-04 改版：待辦、成效總覽、可收合卡片、文案分頁、快選 */
.badge[hidden] { display: none; }
.todo { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px 16px; margin-bottom: 14px; }
.todo .hd { font-size: 13px; color: var(--sub); padding: 8px 0 2px; }
.todo a, .todo button.ti { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 11px 0; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); font: inherit; font-size: 15px; text-decoration: none; cursor: pointer; }
.todo .hd + a, .todo .hd + button.ti { border-top: 0; }
.todo .ic { flex: none; width: 10px; height: 10px; border-radius: 50%; }
.todo .ic.r { background: var(--fix); } .todo .ic.o { background: #e8a33d; } .todo .ic.y { background: color-mix(in srgb, var(--accent) 70%, transparent); }
.todo .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.todo .go { color: var(--sub); font-size: 13px; flex: none; }
.todo .calm { padding: 14px 0; color: var(--sub); font-size: 15px; }
.sum { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.sum .kpi { background: var(--card); border: 1px solid var(--line); }
.sum .kpi b { font-size: 26px; }
.sum .dlt { font-size: 12.5px; font-weight: 700; margin-left: 4px; }
.sum .up { color: var(--ok); } .sum .down { color: var(--fix); } .sum .flat { color: var(--sub); font-weight: 400; }
.card.fold { padding: 0 16px; }
.card.fold > summary { padding: 14px 0; min-height: 52px; }
.card.fold > summary h2 { margin: 0; }
.card.fold > summary::after { font-size: 13px; }
.card.fold[open] { padding-bottom: 14px; }
.seg { display: flex; gap: 4px; background: var(--soft); border-radius: 10px; padding: 3px; margin-top: 10px; }
.seg button { flex: 1; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 700; color: var(--sub); min-height: 36px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.capbox { white-space: pre-wrap; word-break: break-word; font-size: 15px; background: var(--soft); border-radius: 10px; padding: 12px; margin-top: 6px; max-height: 320px; overflow: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips button { border: 1px solid var(--line); background: var(--soft); color: var(--ink); font: inherit; font-size: 14px; border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.datebox input { width: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; padding: 8px 10px; margin-top: 10px; }
.mini { border: 1px solid var(--accent); color: var(--accent); background: none; font: inherit; font-size: 12.5px; border-radius: 8px; padding: 3px 8px; margin-left: 8px; cursor: pointer; white-space: nowrap; }
.mini:disabled { opacity: .5; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14.5px; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.toast[hidden] { display: none; }
/* 2026-11-04 首頁改版 */
.greet { margin: 2px 2px 12px; }
.greet b { display: block; font-size: 22px; line-height: 1.3; }
.greet span { font-size: 14px; color: var(--sub); }
.sec { font-size: 13px; font-weight: 700; color: var(--sub); margin: 18px 2px 8px; display: flex; justify-content: space-between; align-items: baseline; }
.sec button { background: none; border: 0; color: var(--sub); font: inherit; font-weight: 400; cursor: pointer; padding: 4px 0 4px 8px; }
.act { padding: 14px; }
.act.hot { border: 2px solid #ff6a3d; }
.act .row1 { display: flex; gap: 12px; }
.act .th { flex: none; width: 84px; height: 105px; border-radius: 10px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); }
.act .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.act .bd { flex: 1; min-width: 0; }
.act .kd { font-size: 12.5px; font-weight: 700; color: var(--accent); }
.act.hot .kd { color: #e8562a; }
.act .tt { font-size: 16.5px; font-weight: 800; line-height: 1.35; margin: 2px 0 4px; }
.act .pv { font-size: 13.5px; color: var(--sub); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.act .ckl { font-size: 12.5px; margin-top: 4px; color: var(--sub); }
.act .ckl .w { color: var(--fix); font-weight: 700; }
.act .btns { margin-top: 12px; }
.act .btns button { min-height: 48px; font-size: 16px; }
.act .full { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 6px; }
.act .full[hidden] { display: none; }
.act:has(.full:not([hidden])) .row1 .th { display: none; }  /* 展開全文時藏縮圖，照片不重複 */
.linkb { background: none; border: 0; color: var(--sub); font: inherit; font-size: 13.5px; padding: 8px 0 0; cursor: pointer; }
.mini3 .it { padding: 9px 14px; }
.mini3 .st { font-size: 12.5px; white-space: nowrap; color: var(--sub); padding-top: 2px; }
.mini3 .st.w { color: var(--fix); font-weight: 700; }
.mini3 .st.g { color: var(--ok); }
.funnel { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
.funnel .f { text-align: center; flex: 1; }
.funnel .f b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.funnel .f span { font-size: 12px; color: var(--sub); }
.funnel .ar { color: var(--sub); }
.card.flash { box-shadow: 0 0 0 3px var(--accent); transition: box-shadow .3s; }
.toast button { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 800; margin-left: 12px; cursor: pointer; padding: 4px; }
.foot { text-align: center; color: var(--sub); font-size: 13px; padding: 0 16px; margin: -80px 0 0; position: relative; }
.foot:empty { display: none; }
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="brand"><h1><span>CHIU189</span> 秘書</h1><span class="tools"><button id="bell" type="button" aria-label="手機通知">🔔</button><button id="reload" type="button">↻ 重新整理</button></span></div>
  </div>
</div>

<main class="wrap">
  <div id="today" class="today"><div class="hd">載入中…</div></div>
  <section class="pane" id="pane-review"><div id="greet" class="greet"></div><div id="list"></div><div id="todo"></div><div id="mini"></div><div id="done"></div></section>
  <section class="pane" id="pane-sched" hidden><div id="sched"></div></section>
  <section class="pane" id="pane-stats" hidden><div id="stats"></div></section>
  <section class="pane" id="pane-ask" hidden>
    <div class="card"><h2>有事問我</h2><div class="meta">想改排程、問成效、指定下一篇題目…打一句話就好。每天 12:20、20:40 處理，結果會傳 LINE 也會顯示在下面。</div>
      <textarea id="askText" placeholder="例如：下一篇做 iOS 27.2 耗電／11/5 的影片改到 11/6／這週哪篇最多人看？"></textarea>
      <div class="btns"><button type="button" class="okb" id="askSend">送出</button></div><div class="msg" id="askMsg"></div></div>
    <div id="askList"></div>
  </section>
</main>
<div class="foot" id="upd"></div>
<div class="toast" id="toast" hidden></div>
<nav class="tabs" role="tablist" aria-label="分頁">
  <button type="button" role="tab" data-tab="review" aria-selected="true"><span class="ti-ic" aria-hidden="true">🏠</span>首頁<span class="badge" id="badge" hidden></span></button>
  <button type="button" role="tab" data-tab="sched" aria-selected="false"><span class="ti-ic" aria-hidden="true">📅</span>行程</button>
  <button type="button" role="tab" data-tab="stats" aria-selected="false"><span class="ti-ic" aria-hidden="true">📈</span>成效</button>
  <button type="button" role="tab" data-tab="ask" aria-selected="false"><span class="ti-ic" aria-hidden="true">💬</span>問我</button>
</nav>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwcStF05qkS0cKT8l6PoTTzj21ijwnnyyJkoSDqPYZjDxFVG6EadZCwCp2GrKpV7wNSow/exec';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = '日一二三四五六';
const clean = (t) => String(t || '').replace(/[【】]/g, ' ').replace(/\s+/g, ' ').trim();
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
let data = { reviews: [], decisions: {} }, showAll = false;

function getPin() { try { return localStorage.getItem('chiu189_pin') || ''; } catch (e) { return ''; } }
function setPin(v) { try { localStorage.setItem('chiu189_pin', v); } catch (e) {} }
function askPin() { const v = prompt('請輸入審稿密碼（只要輸入一次）'); if (v) setPin(v.trim()); return v ? v.trim() : ''; }
const sched = () => (data.reviews || []).find((r) => r.id === '__schedule__') || {};
const reviews = () => (data.reviews || []).filter((r) => r.id !== '__schedule__');

function setTab(t) {
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  ['review', 'sched', 'stats', 'ask'].forEach((k) => { $('#pane-' + k).hidden = k !== t; });
  $('#today').hidden = t !== 'sched' || !$('#today').dataset.has;
  try { sessionStorage.setItem('chiu189_tab', t); } catch (e) {}
  if (t === 'ask' && !askLoaded) { askLoaded = true; loadAsk(); }
}

let firstLoad = true, loading = false, lastLoad = 0;
async function load(quiet) {
  if (loading) return; loading = true;
  const btn = $('#reload'); btn.textContent = '更新中…'; btn.disabled = true;
  try {
    let r;
    try { r = await fetch(API + '?t=' + Date.now()); } catch (e1) { await new Promise((ok) => setTimeout(ok, 1500)); r = await fetch(API + '?t=' + Date.now()); }
    data = await r.json();
    render();
    const s = sched();
    const age = s.updated ? (Date.now() - new Date(s.updated).getTime()) / 6e4 : 0;   // 行程資料多久沒更新（分鐘）
    $('#upd').innerHTML = age > 60 ? `<span class="warn">⚠️ 行程資料 ${age > 180 ? Math.round(age / 60) + ' 小時' : Math.round(age) + ' 分鐘'}沒更新了，店裡的電腦可能關機或睡眠</span>` : '';
    let saved = ''; try { saved = sessionStorage.getItem('chiu189_tab') || ''; } catch (e) {}
    const waiting = reviews().filter((x) => !(data.decisions || {})[x.id]).length;
    if (firstLoad) { setTab(saved || 'review'); firstLoad = false; }
    else { const cur = document.querySelector('.tabs button[aria-selected="true"]'); setTab(cur ? cur.dataset.tab : 'review'); if (cur && cur.dataset.tab === 'ask') loadAsk(); }
    lastLoad = Date.now();
    if (location.hash.length > 1 && !load._jumped) { load._jumped = true; setTab('review'); const el = document.getElementById('c-' + decodeURIComponent(location.hash.slice(1))); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2500); } }
    btn.textContent = '✓ 已更新';
    setTimeout(() => { btn.textContent = '↻ 重新整理'; }, 1500);
  } catch (e) { if (!quiet) $('#today').innerHTML = '<div class="none">讀不到資料，請稍後按右上角「重新整理」。</div>'; btn.textContent = '↻ 重新整理'; }
  btn.disabled = false; loading = false;
}

function render() { renderToday(); renderReview(); renderTodo(); renderMini(); renderSched(); renderStats(); }


function toast(t, undo) {
  const el = $('#toast'); el.textContent = t; el.hidden = false;
  if (undo) { const b = document.createElement('button'); b.type = 'button'; b.textContent = '復原'; b.onclick = () => { el.hidden = true; undo(); }; el.appendChild(b); }
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.hidden = true; }, undo ? 6000 : 3500);
}

// ① 待辦：所有要你動手的事集中在這裡
function renderTodo() {
  const items = sched().schedule || [], st = sched().stats || {}, rv = reviews();
  const now = new Date(), tk = dayKey(now), out = [];
  const md = (k) => { const d = new Date(k + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`; };
  const waiting = rv.filter((x) => !(data.decisions || {})[x.id]).length;
  todoN = out.length;
  const g = st.gbp;
  if (g && g.unreplied) out.push(['r', `${g.unreplied} 則 Google 評論還沒回（${String(g.reviewsAsOf || g.asOf || '').slice(5, 16).replace('-', '/')} 的資料，每晚更新）`, 'https://business.google.com/reviews', '去回覆']);
  const ago = new Date(now.getTime() - 3 * 864e5);
  items.filter((x) => x.ck === 'fail' && new Date(x.at.replace(' ', 'T')) > ago).forEach((x) => out.push(['r', `${md(x.at.slice(0, 10))}「${clean(x.t).slice(0, 16)}」沒發出去`, 'sched', '看行程']));
  // 接下來 7 天：中午沒圖文、晚上沒影片（已審待排的也算有）
  const noImg = [], noVid = [];
  for (let i = 1; i <= 7; i++) {
    const k = dayKey(new Date(now.getTime() + i * 864e5));
    const day = items.filter((x) => x.at.slice(0, 10) === k);
    if (!day.some((x) => x.k === 'img') && !rv.some((r) => r.kind !== 'vid' && String(r.when || '').startsWith(`${+k.slice(5, 7)}/${+k.slice(8)}`))) noImg.push(k);
    if (!day.some((x) => x.k === 'vid') && !rv.some((r) => r.kind === 'vid' && String(r.when || '').startsWith(`${+k.slice(5, 7)}/${+k.slice(8)}`))) noVid.push(k);
  }
  // 排程缺口只是提醒（合併成一行）；「搜尋找不到」放成效分頁
  const gap = [noImg.length ? `圖文缺 ${noImg.length} 天` : '', noVid.length ? `影片缺 ${noVid.length} 天` : ''].filter(Boolean).join('、');
  const first = [...noImg, ...noVid].sort()[0];
  const remind = gap ? `<button type="button" class="remind" data-go="sched"><span class="tx">📅 排程缺口：${gap}（最近 ${md(first)}）${noVid.length ? '・影片丟進「待發」' : ''}</span><span class="go">看行程 ›</span></button>` : '';
  todoN = out.length;
  const fixes = rv.filter((x) => ((data.decisions || {})[x.id] || {}).decision === 'fix' && !(x.id || '').startsWith('hot-')).length;
  const nowait = !rv.some((x) => !(data.decisions || {})[x.id]);
  $('#todo').innerHTML = (out.length ? `<div class="sec">要你處理</div><div class="todo act">` + out.map(([c, t, go, gl]) => /^https?:/.test(go)
      ? `<a href="${esc(go)}" target="_blank" rel="noopener"><span class="ic ${c}"></span><span class="tx">${esc(t)}</span><span class="go">${gl} ↗</span></a>`
      : `<button type="button" class="ti" data-go="${go}"><span class="ic ${c}"></span><span class="tx">${esc(t)}</span><span class="go">${gl} ›</span></button>`).join('') + '</div>' : '') + (remind ? `<div class="sec">提醒</div>${remind}` : '');
  // 招呼語＋總件數
  const hr = now.getHours(), hi = hr < 11 ? '早安' : hr < 18 ? '午安' : '晚安';
  const waitN = rv.filter((x) => !(data.decisions || {})[x.id]).length, total = waitN + out.length;
  $('#greet').innerHTML = total
    ? `<b>${hi}右丞，還有 ${total} 件事要你處理</b><span>${waitN ? `${waitN} 篇等你審` : ''}${waitN && out.length ? '・' : ''}${out.length ? `${out.length} 件要處理` : ''}${fixes ? `・${fixes} 篇 Claude 改稿中` : ''}</span>`
    : `<b>${hi}右丞，今天沒事了 ✅</b><span>${nowait ? '新稿做好會傳 LINE 給你' : ''}</span>`;
}
let todoN = 0;
$('#todo').addEventListener('click', (e) => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  if (b.dataset.go === 'review') { const l = $('#list'); if (l) l.scrollIntoView({ behavior: 'smooth' }); }
  else { setTab(b.dataset.go); window.scrollTo({ top: 0 }); }
});

function renderToday() {
  const now = new Date(), tk = dayKey(now);
  const tm = new Date(now.getTime() + 864e5), mk = dayKey(tm);
  const items = sched().schedule || [];
  const line = (x) => `<div class="row"><span class="tm">${esc(x.at.slice(11, 16))}</span><span class="dot ${x.k}"></span><span class="t">${esc(clean(x.t))}</span></div>`;
  const td = items.filter((x) => x.at.slice(0, 10) === tk), tmr = items.filter((x) => x.at.slice(0, 10) === mk);
  const waiting = reviews().filter((x) => !(data.decisions || {})[x.id]).length;
  // 2026-11-04 用戶：行程重複看兩次 → 不再列今天／明天，下面的行程表就有；只留沒發出去的警告
  $('#today').innerHTML = '';
  const fails = items.filter((x) => x.ck === 'fail');
  $('#today').dataset.has = fails.length ? '1' : '';
  if (fails.length) $('#today').innerHTML += `<div class="alert">⚠️ ${fails.length} 篇沒發出去：${fails.map((x) => esc(x.at.slice(5, 10).replace('-', '/') + ' ' + clean(x.t).slice(0, 14))).join('、')}<br>到「交代」打「補發」，或叫 Claude 處理。</div>`;
  const b = $('#badge'); b.hidden = !waiting; b.textContent = waiting;
}

function hotExpire(id) {
  const m = /^hot-(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(id || ''); if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
  if (d.getHours() >= 22 || d.getHours() < 7) { const e = new Date(d); if (d.getHours() >= 22) e.setDate(e.getDate() + 1); e.setHours(10, 0, 0, 0); return e; }
  return new Date(d.getTime() + 6 * 3600e3);
}
function hotFixLab(d) {
  // 熱議按「不發」或「要改」都是 decision fix；意見只存在按的那支手機上，別台看到的是通用文字
  const n = (d && d.note) || '';
  return n === '熱議不發' ? '不發・等系統拿掉' : n ? '要改・Claude 改好會傳 LINE' : '不發或要改・等系統處理';
}
function fullCard(r, i) {
  // 原本的完整卡片（圖、查證、文案、改日期、要改）→ 收在「看全文」裡
  const d = (data.decisions || {})[r.id], st = d ? d.decision : 'wait', hot = (r.id || '').startsWith('hot-');
  const inner = (() => {
    if (hot) { const th = (r.caps || {}).Threads || '';
      const htag = st === 'ok' ? '<span class="tag ok">已通過・5 分鐘內發 Threads</span>' : st === 'fix' ? `<span class="tag fix">${hotFixLab(d)}</span>` : '<span class="tag wait">等你審・沒按會自動作廢（晚上做的留到早上 10 點）</span>';
      return `<div>
      <h2>🔥 ${esc(clean(r.title))}</h2>
      <div class="meta"><b>熱議快訊・只發 Threads</b>・按通過 5 分鐘內發</div>
      ${htag}
      <div class="imgs">${(r.imgs || []).map((src, k) => `<img src="${esc(src)}" alt="第 ${k + 1} 張圖" loading="lazy">`).join('')}</div>
      <ul class="check">${(r.check || []).map((c) => `<li>${esc(c)}</li>`).join('')}</ul>
      <div class="capbox">${esc(th)}</div>
      ${st === 'wait' ? `<div class="btns"><button type="button" class="okb" data-act="ok">通過，馬上發</button><button type="button" data-act="fix">要改</button><button type="button" data-act="hotno">不發</button></div>
      <div class="fixbox" hidden><div class="chips">${['文案再短一點', '口氣再好笑一點', '換一張圖', '圖上的字改一下', '傳聞要寫清楚'].map((c) => `<button type="button" data-chip="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('')}</div><textarea placeholder="點上面的選項，或自己寫：例如文案改成「…」、圖換成背面"></textarea><div class="note2">Claude 改好會放回這裡、傳 LINE 給你，再按通過才發。熱議有時效，大約 10～20 分鐘改好。</div><div class="btns"><button type="button" class="okb" data-act="sendfix">送出意見</button><button type="button" data-act="cancel">取消</button></div></div>` : '<div class="btns"><button type="button" class="ghost" data-act="clear">按錯了，撤回決定</button></div>'}
    </div>`; }
    const tag = st === 'ok' ? '<span class="tag ok">已通過・等自動排程</span>' : st === 'fix' ? '<span class="tag fix">已退回・等 Claude 改</span>' : '<span class="tag wait">等你審</span>';
    const caps = r.caps || {}, n = (r.imgs || []).length;
    return `<div>
      <h2>${esc(clean(r.title))}</h2>
      <div class="meta">預計 <b>${esc(r.when)}</b>・${r.kind === 'vid' ? '影片・FB／IG' : 'FB／IG／Threads'}</div>
      ${tag}
      <div class="imgs">${(r.imgs || []).map((src, k) => `<img src="${esc(src)}" alt="第 ${k + 1} 張圖" loading="lazy">`).join('')}</div>
      ${n > 1 ? `<div class="hint">${r.kind === 'vid' ? `影片畫面 ${n} 張` : `共 ${n} 張`}，左右滑 →</div>` : ''}
      <ul class="check">${(r.check || []).map((c) => `<li>${esc(c)}</li>`).join('')}</ul>
      ${(() => { const ks = ['FB', 'IG', 'Threads'].filter((k) => caps[k]).filter((k) => !(k === 'IG' && caps.IG === caps.FB)); if (!ks.length) return ''; const lab = (k) => k === 'FB' && caps.IG === caps.FB ? 'FB／IG' : k;
        return `<div class="seg" role="group" aria-label="文案">${ks.map((k, j) => `<button type="button" data-cap="${k}" aria-pressed="${j === 0}">${lab(k)}</button>`).join('')}</div><div class="capbox">${esc(caps[ks[0]])}</div>`; })()}
      <div class="btns"><button type="button" class="okb" data-act="ok"${st === 'ok' ? ' disabled' : ''}>${st === 'ok' ? '已通過 ✓' : '通過'}</button><button type="button" data-act="date">改日期</button><button type="button" data-act="fix">要改</button></div>
      <div class="datebox" hidden><input type="date" min="${dayKey(new Date(Date.now() + 864e5))}"><div class="note2">選好日期按「用這天通過」，${r.kind === 'vid' ? '晚上 7 點' : '中午 11 點'}發。那天已經有貼文會自動順延。不用 Claude 改稿。</div><div class="btns"><button type="button" class="okb" data-act="okdate">用這天通過</button><button type="button" data-act="cancel">取消</button></div></div>
      <div class="fixbox" hidden><div class="chips">${(r.kind === 'vid' ? ['開頭再好笑一點', '文案短一點', '換 hashtag', '機型寫錯了'] : ['換封面', '標題再短一點', '口氣再好笑一點', '圖片字太多', 'Threads 換一句']).map((c) => `<button type="button" data-chip="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('')}</div><textarea placeholder="點上面的選項，或自己寫：例如第 3 張字太多、換題目"></textarea><div class="note2">一次把意見寫完整，Claude 只要改一次，比較省額度。</div><div class="btns"><button type="button" class="okb" data-act="sendfix">送出意見</button><button type="button" data-act="cancel">取消</button></div></div>
      ${st !== 'wait' ? '<div class="btns"><button type="button" class="ghost" data-act="clear">按錯了，撤回決定</button></div>' : ''}
    </div>`;
  })();
  return inner;
}
function renderReview() {
  const rv = reviews(), dec = data.decisions || {};
  const wait = rv.map((r, i) => [r, i]).filter(([r]) => !dec[r.id]).sort((a, b) => ((b[0].id || '').startsWith('hot-') - (a[0].id || '').startsWith('hot-')));
  const done = rv.map((r, i) => [r, i]).filter(([r]) => dec[r.id]);
  $('#list').innerHTML = wait.map(([r, i]) => {
    const hot = (r.id || '').startsWith('hot-'), vid = r.kind === 'vid', caps = r.caps || {};
    const ex = hot ? hotExpire(r.id) : null;
    const left = ex ? Math.max(0, Math.round((ex - Date.now()) / 36e5 * 10) / 10) : null;
    const kd = hot ? `🔥 熱議・只發 Threads${left != null ? `・${left < 1 ? '快過期了' : `還有 ${Math.round(left)} 小時`}` : ''}` : vid ? `🎬 影片・${esc(r.when)}` : `📝 教學文・${esc(r.when)}`;
    const pv = hot ? (caps.Threads || '') : (caps.FB || caps.Threads || '');
    const ck = r.check || [], okN = ck.filter((c) => c.startsWith('✅')).length, wN = ck.length - okN;
    const ckl = ck.length ? (wN ? `查證 ✅ ${okN} 項・<span class="w">⚠️ ${wN} 項要注意</span>` : `查證 ✅ ${okN} 項全部通過`) : '';
    return `<article class="card act${hot ? ' hot' : ''}" data-i="${i}" id="c-${esc(r.id)}">
      <div class="row1">${(r.imgs || [])[0] ? `<div class="th"><img src="${esc(r.imgs[0])}" alt="封面"></div>` : ''}
        <div class="bd"><div class="kd">${kd}</div><div class="tt">${esc(clean(String(r.title || '').split('｜')[0]))}</div><div class="pv">${esc(pv)}</div>${ckl ? `<div class="ckl">${ckl}</div>` : ''}</div></div>
      <div class="btns">${hot ? '<button type="button" class="okb" data-act="ok">通過，馬上發</button><button type="button" data-act="fixopen">要改</button><button type="button" data-act="hotno">不發</button>' : '<button type="button" class="okb" data-act="ok">通過</button><button type="button" data-act="fixopen">要改</button>'}</div>
      <button type="button" class="linkb" data-act="toggle">看全文${(r.imgs || []).length > 1 ? `（${r.imgs.length} 張圖）` : ''} ›</button>
      <div class="full" hidden>${fullCard(r, i)}</div>
      <div class="msg"></div>
    </article>`;
  }).join('');
  $('#done').innerHTML = done.length ? `<div class="sec">已處理</div>` + done.map(([r, i]) => {
    const st = dec[r.id].decision, hot = (r.id || '').startsWith('hot-');
    const lab = hot ? (st === 'ok' ? '已通過・5 分鐘內發 Threads' : hotFixLab(dec[r.id])) : (st === 'ok' ? '已通過・等自動排程' : '已退回・等 Claude 改');
    return `<article class="card done" data-i="${i}" style="padding:12px 16px;opacity:.75">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div style="font-size:15px;font-weight:700">${emo} ${title}</div>${cmp}</div>
    <div style="font-size:34px;font-weight:800;line-height:1.15;margin-top:6px">${num}<span style="font-size:15px;font-weight:600;color:var(--sub);margin-left:6px">${unit}</span></div>
    <div style="font-size:13px;color:var(--sub);margin-top:4px">${desc}</div>${sub ? `<div style="font-size:13px;color:var(--sub);margin-top:2px">${sub}</div>` : ''}</div>`;
  const arrow = '';
  // 2026-11-07 成效改版：結果（來店）放最上面 → 廣告 → 官網 → 社群曝光；最上面一兩句建議
  const V = data.visits || {};
  const vSum = (days) => { const out = {}; let tot = 0; for (let i = 0; i < days; i++) { const k = dayKey(new Date(Date.now() - i * 864e5)); Object.entries(V[k] || {}).forEach(([s, c]) => { out[s] = (out[s] || 0) + c; tot += c; }); } return [tot, out]; };
  const [v30, v30s] = vSum(30), [v7] = vSum(7);
  const ads = (st.ads || {}).ads || [];
  const views = (thr.posts || []).map((p) => p.views || 0).sort((a, b) => a - b);
  const med = views.length ? views[Math.floor((views.length - 1) / 2)] : null;
  const topP = tops[0], share = topP && tv ? Math.round((topP.views || 0) / tv * 100) : 0;
  // 2026-11-07 排版整理：每張卡同一套格式＝標題列（左標題、右期間小標籤）→ 大數字（右邊變化）→ 一句說明 → 明細列（左名稱＋小字、右數字＋小字）
  const tips = [];
  if (g && g.unreplied) tips.push(['⭐', `Google 有 ${g.unreplied} 則評論沒回`]);
  const live = ads.filter((a) => a.clicks >= 10 && a.cpc_twd);
  if (live.length >= 2) { const s = live.slice().sort((a, b) => a.cpc_twd - b.cpc_twd); const x = s[s.length - 1].cpc_twd / s[0].cpc_twd; if (x >= 1.5) tips.push(['📣', `廣告「${s[0].name.replace('（Google 地圖）', '')}」每次點擊比「${s[s.length - 1].name.replace('（Google 地圖）', '')}」便宜 ${x.toFixed(1)} 倍`]); }
  if (ct && ct.by && ct.by.kind && ct.by.kind.IG) { const k = ct.by.kind.IG.filter((r) => r[2] >= 3).sort((a, b) => b[1] - a[1]); if (k.length >= 2 && k[0][1] >= k[k.length - 1][1] * 1.5) tips.push(['📝', `IG 上「${k[0][0]}」的觀看是「${k[k.length - 1][0]}」的 ${(k[0][1] / Math.max(1, k[k.length - 1][1])).toFixed(1)} 倍`]); }
  const tipBox = tips.length ? `<div class="sc tips"><div class="sc-hd"><span>💡 這週建議</span></div>${tips.slice(0, 3).map(([i, t]) => `<div class="tip"><span class="ti">${i}</span><span>${esc(t)}</span></div>`).join('')}</div>` : '';
  const chip = (t) => t ? `<span class="chip">${t}</span>` : '';
  const delta = (a, b) => { if (a == null || b == null) return ''; const d = a - b; return d > 0 ? `<span class="dl up">↑ ${n(d)}</span>` : d < 0 ? `<span class="dl down">↓ ${n(-d)}</span>` : '<span class="dl">持平</span>'; };
  const row = (l, ls, v, vs2) => `<div class="sr"><div class="sl">${l}${ls ? `<small>${ls}</small>` : ''}</div><div class="sv">${v}${vs2 ? `<small>${vs2}</small>` : ''}</div></div>`;
  const card = (emo, title, ch, num, unit, dl, desc, body, foot) => `<div class="sc"><div class="sc-hd"><span>${emo} ${title}</span>${chip(ch)}</div>
    <div class="sc-big"><b>${num}</b>${unit ? `<i>${unit}</i>` : ''}${dl || ''}</div>${desc ? `<div class="sc-desc">${desc}</div>` : ''}${body || ''}${foot ? `<div class="sc-foot">${foot}</div>` : ''}</div>`;
  const mon = curM.m ? +curM.m.slice(5) + ' 月' : '上個月';
  const visitCard = card('🏃', 'Google 地圖查路線', mon, n(curM.dirs), '次', curM.m && preM.m ? delta(curM.dirs, preM.dirs) : '', '想來店的人按「路線」的次數・跟上個月比',
    row('Google 商家打電話', mon, n(curM.calls), '') + row('官網按電話／LINE', '近 7 天', want == null ? '—' : n(want), ''));
  const adCard = ads.length ? card('📣', '廣告花費', '近 30 天', 'NT$' + n(st.ads.twd), '', '', `換到 ${n(st.ads.clicks)} 次點擊`,
    ads.map((a) => row(esc(a.name.replace('（Google 地圖）', '')), `${a.on ? '播到 ' + esc(a.end) : '已停'}・花 NT$${n(a.twd)}`, `${n(a.clicks)} 次`, `每次 NT$${a.cpc_twd == null ? '—' : a.cpc_twd}`)).join(''),
    `更新 ${esc(String(st.ads.asOf).slice(11))}`) : '';
  const webCard = card('🌐', '逛官網的人', '近 7 天', wb.asOf ? n(wb.users) : '—', '人', wb.asOf && wb.usersPrev ? delta(wb.users, wb.usersPrev) : '', wb.asOf && !wb.usersPrev ? '11/4 才開始記錄，下週起可以跟上週比' : '跟上週比',
    row('按電話或 LINE', '', want == null ? '—' : n(want) + ' 人', ''));
  const thrCard = card('👀', 'Threads 一般一篇', '近 7 天', med == null ? '—' : n(med), '次觀看', '', `${views.length} 篇的中位數・粉絲 ${n(thr.followers)} 人`,
    tops.map((p, k) => `<a class="sr link" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="sl"><span class="rk">${k + 1}</span>${esc(p.t)}</div><div class="sv">${n(p.views)}</div></a>`).join(''),
    topP && share >= 40 ? `第 1 篇占了全部觀看的 ${share}%` : '');
  const simple = tipBox + visitCard + adCard + webCard + thrCard;
  const more = `<details class="card fold" data-k="__more"${open.__more ? ' open' : ''}><summary><h2>看詳細數據</h2></summary><div class="note2" style="margin-bottom:8px">比較複雜，平常不用看；要問什麼直接到「交代」問就好。</div>${sum}${all}</details>`;
  $('#stats').innerHTML = simple + more;
  $('#stats').querySelectorAll('details.fold').forEach((d) => d.addEventListener('toggle', () => { try { const o = JSON.parse(localStorage.getItem('chiu189_open') || '{}'); o[d.dataset.k] = d.open; localStorage.setItem('chiu189_open', JSON.stringify(o)); } catch (e) {} }));
}

async function decide(card, decision, note) {
  const r = reviews()[+card.dataset.i];
  const pin = getPin() || askPin();
  if (!pin) return;
  const msg = card.querySelector(':scope > .msg') || card.querySelector('.msg');
  card.querySelectorAll('button').forEach((b) => (b.disabled = true));
  msg.textContent = '存檔中…';
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: 'decide', id: r.id, decision, note: note || '', pin }) });
    const j = await res.json();
    if (!j.ok && j.error === 'pin') { setPin(''); msg.textContent = '密碼不對，請再按一次重新輸入。'; card.querySelectorAll('button').forEach((b) => (b.disabled = false)); return; }
    if (!j.ok) throw new Error(j.error);
    if (decision === 'clear') delete data.decisions[r.id]; else data.decisions[r.id] = { decision, note: note || '' };
    renderToday(); renderReview(); renderTodo(); renderMini();
    const idx = card.dataset.i;
    if (decision === 'ok' || decision === 'fix') toast(decision === 'ok' ? ((r.id || '').startsWith('hot-') ? '✅ 已通過，5 分鐘內發 Threads' : '✅ 已通過，會自動排程') : (note === '熱議不發' ? '好，這篇不發' : '意見收到，Claude 改好會傳 LINE'), () => { const c = document.querySelector(`.card[data-i="${idx}"]`); if (c) decide(c, 'clear'); });
    else toast('已復原');
    const m = null;
    if (m) m.textContent = decision === 'ok' ? (note && note.startsWith('日期:') ? `已存好！會排在 ${+note.slice(8, 10)}/${+note.slice(11, 13)}，晚上 9:30 或早上 10:00 自動排程。` : '已存好！晚上 9:30 或早上 10:00 會自動排程，排好傳 LINE 給你。') : decision === 'fix' ? '意見收到，Claude 改好會再傳 LINE 給你。' : '已撤回。';
  } catch (e) { msg.textContent = '沒存到，請再按一次。'; card.querySelectorAll('button').forEach((b) => (b.disabled = false)); }
}

$('#list').addEventListener('click', (e) => {
  const cb = e.target.closest('button[data-cap]');
  if (cb) { const card = cb.closest('.card'), r = reviews()[+card.dataset.i]; card.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === cb))); card.querySelector('.capbox').textContent = (r.caps || {})[cb.dataset.cap] || ''; return; }
  const ch = e.target.closest('button[data-chip]');
  if (ch) { const ta = ch.closest('.fixbox').querySelector('textarea'), on = ch.getAttribute('aria-pressed') !== 'true', c = ch.dataset.chip; ch.setAttribute('aria-pressed', String(on)); const parts = ta.value.split('、').map((x) => x.trim()).filter(Boolean).filter((x) => x !== c); if (on) parts.push(c); ta.value = parts.join('、'); return; }
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const card = b.closest('.card'), act = b.dataset.act, box = card.querySelector('.fixbox');
  if (act === 'toggle') { const f = card.querySelector('.full'); f.hidden = !f.hidden; b.textContent = f.hidden ? '看全文 ›' : '收起全文'; return; }
  if (act === 'fixopen') { const f = card.querySelector('.full'); f.hidden = false; card.querySelector('[data-act="toggle"]').textContent = '收起全文'; if (box) { box.hidden = false; const dd = card.querySelector('.datebox'); if (dd) dd.hidden = true; box.querySelector('textarea').focus(); } return; }
  const dbox = card.querySelector('.datebox');
  if (act === 'ok') decide(card, 'ok');
  else if (act === 'fix') { if (dbox) dbox.hidden = true; box.hidden = false; box.querySelector('textarea').focus(); }
  else if (act === 'date') { box.hidden = true; dbox.hidden = false; }
  else if (act === 'okdate') { const v = dbox.querySelector('input').value; if (!v) { dbox.querySelector('input').focus(); return; } decide(card, 'ok', '日期:' + v); }
  else if (act === 'cancel') { box.hidden = true; if (dbox) dbox.hidden = true; }
  else if (act === 'sendfix') { const t = box.querySelector('textarea').value.trim(); if (!t) { box.querySelector('textarea').focus(); return; } decide(card, 'fix', t); }
  else if (act === 'clear') decide(card, 'clear');
  else if (act === 'hotno') decide(card, 'fix', '熱議不發');
});
$('#stats').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-topic]'); if (!b) return;
  e.preventDefault();
  const topic = b.dataset.topic.replace('｜', ' ');
  if (!confirm(`把「${topic}」設成下一篇貼文的題目？`)) return;
  b.disabled = true;
  try { const j = await askApi({ a: 'ask', text: `【下一篇題目】${topic}（報價頁很多人想修）` }); if (j) { b.textContent = '✓ 已指定'; toast('收到！15 分鐘內排進下一篇，晚上 8:10 做稿會用這題。'); } else b.disabled = false; }
  catch (err) { b.disabled = false; toast(err.message === 'pin' ? '密碼不對，請再按一次。' : '沒送出去，請再按一次。'); }
});
$('#sched').addEventListener('click', (e) => { if (e.target.id === 'more') { showAll = true; renderSched(); } });
document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) { setTab(b.dataset.tab); window.scrollTo({ top: 0 }); } });
async function askApi(body) {
  const pin = getPin() || askPin(); if (!pin) return null;
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pin }, body)) });
  const j = await res.json();
  if (!j.ok && j.error === 'pin') { setPin(''); throw new Error('pin'); }
  if (!j.ok) throw new Error(j.error);
  return j;
}
function renderAsk(list) {
  const st = { new: '等處理', done: '已處理', need_you: '要你處理' };
  $('#askList').innerHTML = (list || []).map((q) => `<div class="req"><div class="q">${esc(q.text)}</div>${q.reply ? `<div class="a">${esc(q.reply)}</div>` : ''}<div class="s">${new Date(q.at).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })}・${st[q.status] || q.status}</div></div>`).join('') || '<div class="empty">還沒有交代過事情</div>';
}
async function loadAsk() {
  $('#askList').innerHTML = '<div class="empty">載入中…</div>';
  try { const j = await askApi({ a: 'my_requests' }); if (j) renderAsk(j.requests); else $('#askList').innerHTML = '<div class="empty">輸入審稿密碼後才看得到</div>'; }
  catch (e) { $('#askList').innerHTML = e.message === 'pin' ? '<div class="empty">密碼不對，切換分頁再試一次</div>' : '<div class="empty">讀不到，請稍後再試</div>'; }
}
$('#askSend').addEventListener('click', async () => {

  $('#askSend').disabled = true; $('#askMsg').textContent = '送出中…';
  try { const j = await askApi({ a: 'ask', text: t }); if (j) { $('#askText').value = ''; $('#askMsg').textContent = '收到！12:20 或 20:40 處理，結果會傳 LINE。'; renderAsk(j.requests); } else $('#askMsg').textContent = ''; }
  catch (e) { $('#askMsg').textContent = e.message === 'pin' ? '密碼不對，請再按一次。' : '沒送出去，請再按一次。'; }

});

const VKEY = 'BLhs0DJUE33sMiuIRjj2soT-aUv_vdtW3cdyiIPmvblvO-Ze0STOGeTNL3GMBRmfIBC3vI5y11X1QyTTRH-gAkA';
const bell = $('#bell'), canPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent), standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
let swReg = null;
const b64key = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); };
const setBell = (on) => bell.classList.toggle('on', on);
async function saveSub(sub, a) { const pin = getPin() || askPin(); if (!pin) throw new Error('nopin'); const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: a || 'push_sub', pin, sub: sub.toJSON() }) }); const j = await res.json(); if (!j.ok && j.error === 'pin') { setPin(''); throw new Error('pin'); } if (!j.ok) throw new Error(j.error); }
if (canPush) {
  swReg = navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready);
  swReg.then((r) => r.pushManager.getSubscription()).then((sub) => { if (sub && Notification.permission === 'granted') { setBell(true); if (getPin()) saveSub(sub).catch(() => {}); } }).catch(() => {});
}
bell.addEventListener('click', async () => {
  if (/Line\//.test(navigator.userAgent)) return alert('LINE 裡面沒辦法開通知，請按右上角「⋯」→ 用預設瀏覽器開啟，再按 🔔。');
  if (isIOS && !standalone) return alert('iPhone 要先加到主畫面：\n1. 用 Safari 打開這頁\n2. 按下方「分享」⬆︎\n3. 選「加入主畫面」\n4. 從主畫面的 CHIU189 審稿 圖示打開，再按 🔔');
  if (!canPush) return alert('這個瀏覽器不支援通知，請用 iPhone 主畫面圖示或 Chrome 打開。');
  try {
    const r = await swReg;
    let sub = await r.pushManager.getSubscription();
    if (bell.classList.contains('on') && sub) {
      if (!confirm('要關掉手機通知嗎？')) return;
      await saveSub(sub, 'push_unsub').catch(() => {}); await sub.unsubscribe(); setBell(false); return toast('已關掉通知');
    }
    const p = await Notification.requestPermission();
    if (p !== 'granted') return alert('通知被關掉了：請到 iPhone「設定 → 通知 → CHIU189 審稿」打開，再按一次 🔔。');
    sub = sub || await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64key(VKEY) });
    await saveSub(sub); setBell(true); toast('已開啟！有新稿、排程結果會直接通知你 🔔');
  } catch (e) { toast(e.message === 'pin' ? '密碼不對，請再按一次 🔔' : e.message === 'nopin' ? '要輸入審稿密碼才能開通知' : '沒開成功，請再按一次 🔔'); }
});
