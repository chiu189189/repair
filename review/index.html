<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-title" content="CHIU189 審稿">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>CHIU189 審稿行程</title>
<style>
:root {
  --bg: #f4f1ea; --card: #ffffff; --soft: #f1ece2; --ink: #1e1b14; --sub: #6b6458; --line: #e6dfd2;
  --accent: #A6843F; --accent-ink: #1E1B14; --ok: #1f8a4c; --fix: #c2410c; --img: #A6843F; --vid: #3b6fd8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14130f; --card: #1d1b16; --soft: #26231d; --ink: #f3efe6; --sub: #a69e8f; --line: #312d25;
    --accent: #C8A96A; --accent-ink: #1E1B14; --ok: #3fc47f; --fix: #fb923c; --img: #C8A96A; --vid: #7aa2ff;
  }
}
:root[data-theme="dark"] {
  --bg: #14130f; --card: #1d1b16; --soft: #26231d; --ink: #f3efe6; --sub: #a69e8f; --line: #312d25;
  --accent: #C8A96A; --accent-ink: #1E1B14; --ok: #3fc47f; --fix: #fb923c; --img: #C8A96A; --vid: #7aa2ff;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

/* 頂部：標題＋分頁（捲動時固定） */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 0 10px; }
.brand h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
.brand h1 span { color: var(--accent); }
.brand button { background: none; border: 0; color: var(--sub); font: inherit; font-size: 13px; padding: 6px 0 6px 8px; cursor: pointer; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--soft); border-radius: 12px; padding: 4px; margin-bottom: 10px; }
.tabs button { border: 0; background: none; color: var(--sub); font: inherit; font-weight: 700; font-size: 15px; min-height: 40px; border-radius: 9px; cursor: pointer; position: relative; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.badge { display: inline-block; min-width: 20px; height: 20px; line-height: 20px; border-radius: 10px; background: var(--fix); color: #fff; font-size: 12px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }

main { padding: 14px 0 40px; }
.pane[hidden] { display: none; }

/* 今日摘要 */
.today { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
.today .hd { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
.today .row { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; font-size: 15px; }
.today .row .tm { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 44px; }
.today .row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today .none { color: var(--sub); font-size: 15px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }
.dot.img { background: var(--img); } .dot.vid { background: var(--vid); }

/* 卡片 */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 0 0 14px; }
.card h2 { font-size: 18px; margin: 0 0 4px; line-height: 1.45; }
.meta { color: var(--sub); font-size: 14px; }
.meta b { color: var(--accent); }
.tag { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 2px 10px; margin: 8px 0 2px; }
.tag.wait { background: color-mix(in srgb, var(--fix) 15%, transparent); color: var(--fix); }
.tag.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.tag.fix { background: color-mix(in srgb, var(--fix) 15%, transparent); color: var(--fix); }
.imgs { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 12px -16px; padding: 0 16px 4px; scrollbar-width: none; }
.imgs::-webkit-scrollbar { display: none; }
.imgs img { width: 80%; max-width: 320px; flex: none; border-radius: 10px; scroll-snap-align: center; border: 1px solid var(--line); }
.hint { font-size: 12.5px; color: var(--sub); text-align: right; margin-top: -6px; }
.check { margin: 10px 0; padding: 0; list-style: none; font-size: 14.5px; }
.check li { padding: 4px 0; border-top: 1px dashed var(--line); }
.check li:first-child { border-top: 0; }
details { border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; background: var(--soft); }
summary { cursor: pointer; padding: 10px 12px; font-weight: 700; min-height: 44px; display: flex; align-items: center; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "展開"; margin-left: auto; font-size: 13px; font-weight: 400; color: var(--sub); }
details[open] summary::after { content: "收起"; }
details pre { white-space: pre-wrap; word-break: break-word; margin: 0; padding: 0 12px 12px; font: inherit; font-size: 15px; }
.btns { display: flex; gap: 10px; margin-top: 12px; }
.btns button { flex: 1; min-height: 50px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; border: 1px solid var(--line); background: var(--soft); color: var(--ink); }
.btns .okb { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btns .ghost { background: none; font-size: 14px; min-height: 40px; color: var(--sub); border-style: dashed; }
.btns button:disabled { opacity: .5; }
textarea { width: 100%; min-height: 90px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; padding: 10px; margin-top: 10px; }
.msg { font-size: 14px; color: var(--sub); margin-top: 8px; }
.msg:empty { display: none; }
.empty { text-align: center; color: var(--sub); padding: 28px 12px; font-size: 15px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }

/* 行程 */
.dayhd { font-size: 14px; font-weight: 700; color: var(--sub); margin: 16px 2px 6px; display: flex; gap: 8px; align-items: center; }
.dayhd.is-today { color: var(--accent); }
.dayhd:first-child { margin-top: 0; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.it { display: flex; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--line); align-items: flex-start; }
.it:first-child { border-top: 0; }
.it .tm { font-weight: 700; min-width: 44px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.it .bd { flex: 1; min-width: 0; }
.it .tt { font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
.it .pl { font-size: 12.5px; color: var(--sub); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.it .pl .bad { color: var(--fix); font-weight: 700; }
.it .pl .good { color: var(--ok); }
.it.done { opacity: .5; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--sub); margin: 0 2px 10px; }
.more { width: 100%; margin-top: 12px; min-height: 44px; border-radius: 12px; border: 1px dashed var(--line); background: none; color: var(--sub); font: inherit; cursor: pointer; }

/* 成效 */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0 6px; }
.kpi { background: var(--soft); border-radius: 12px; padding: 10px; }
.kpi b { display: block; font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12.5px; color: var(--sub); }
.note2 { font-size: 13.5px; color: var(--sub); margin-top: 6px; }
.tp { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.tp:first-of-type { border-top: 0; }
.tp a { color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.tp .v { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--soft); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.sub-h { font-size: 13px; color: var(--sub); margin: 12px 0 2px; }
.ck-ok { color: var(--ok); } .ck-bad { color: var(--fix); font-weight: 700; }
.alert { background: color-mix(in srgb, var(--fix) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--fix) 40%, transparent); color: var(--ink); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 14.5px; }
.req { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.req .q { font-weight: 700; overflow-wrap: anywhere; }
.req .a { margin-top: 6px; font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.req .s { font-size: 12.5px; color: var(--sub); margin-top: 4px; }
.foot { text-align: center; color: var(--sub); font-size: 12.5px; padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="brand"><h1><span>CHIU189</span> 審稿行程</h1><button id="reload" type="button">↻ 重新整理</button></div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="review" aria-selected="true">審稿<span class="badge" id="badge" hidden></span></button>
      <button type="button" role="tab" data-tab="sched" aria-selected="false">行程</button>
      <button type="button" role="tab" data-tab="stats" aria-selected="false">成效</button>
      <button type="button" role="tab" data-tab="ask" aria-selected="false">交代</button>
    </div>
  </div>
</div>

<main class="wrap">
  <div id="today" class="today"><div class="hd">載入中…</div></div>
  <section class="pane" id="pane-review"><div id="list"></div></section>
  <section class="pane" id="pane-sched" hidden><div id="sched"></div></section>
  <section class="pane" id="pane-stats" hidden><div id="stats"></div></section>
  <section class="pane" id="pane-ask" hidden>
    <div class="card"><h2>交代小秘</h2><div class="meta">想改排程、問成效、指定下一篇題目…打一句話就好。每天 12:20、20:40 處理，結果會傳 LINE 也會顯示在下面。</div>
      <textarea id="askText" placeholder="例如：下一篇做 iOS 27.2 耗電／11/5 的影片改到 11/6／這週哪篇最多人看？"></textarea>
      <div class="btns"><button type="button" class="okb" id="askSend">送出</button></div><div class="msg" id="askMsg"></div></div>
    <div id="askList"></div>
  </section>
</main>
<div class="foot" id="upd"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwcStF05qkS0cKT8l6PoTTzj21ijwnnyyJkoSDqPYZjDxFVG6EadZCwCp2GrKpV7wNSow/exec';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = '日一二三四五六';
const clean = (t) => String(t || '').replace(/[【】]/g, ' ').replace(/\s+/g, ' ').trim();
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
let data = { reviews: [], decisions: {} }, showAll = false;

function getPin() { try { return localStorage.getItem('chiu189_pin') || ''; } catch (e) { return ''; } }
function setPin(v) { try { localStorage.setItem('chiu189_pin', v); } catch (e) {} }
function askPin() { const v = prompt('請輸入審稿密碼（只要輸入一次）'); if (v) setPin(v.trim()); return v ? v.trim() : ''; }
const sched = () => (data.reviews || []).find((r) => r.id === '__schedule__') || {};
const reviews = () => (data.reviews || []).filter((r) => r.id !== '__schedule__');

function setTab(t) {
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  ['review', 'sched', 'stats', 'ask'].forEach((k) => { $('#pane-' + k).hidden = k !== t; });
  $('#today').hidden = t !== 'sched';
  try { sessionStorage.setItem('chiu189_tab', t); } catch (e) {}
  if (t === 'ask' && !askLoaded) { askLoaded = true; loadAsk(); }
}

let firstLoad = true, loading = false, lastLoad = 0;
async function load(quiet) {
  if (loading) return; loading = true;
  const btn = $('#reload'); btn.textContent = '更新中…'; btn.disabled = true;
  try {
    let r;
    try { r = await fetch(API + '?t=' + Date.now()); } catch (e1) { await new Promise((ok) => setTimeout(ok, 1500)); r = await fetch(API + '?t=' + Date.now()); }
    data = await r.json();
    render();
    const s = sched();
    $('#upd').textContent = `頁面更新 ${new Date().toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })}` + (s.updated ? `・行程資料 ${s.updated.slice(5).replace('-', '/').replace('T', ' ')}（電腦開著時每 15 分鐘同步）` : '');
    let saved = ''; try { saved = sessionStorage.getItem('chiu189_tab') || ''; } catch (e) {}
    const waiting = reviews().filter((x) => !(data.decisions || {})[x.id]).length;
    if (firstLoad) { setTab(saved || (waiting ? 'review' : 'sched')); firstLoad = false; }
    else { const cur = document.querySelector('.tabs button[aria-selected="true"]'); setTab(cur ? cur.dataset.tab : 'review'); if (cur && cur.dataset.tab === 'ask') loadAsk(); }
    lastLoad = Date.now();
    btn.textContent = '✓ 已更新';
    setTimeout(() => { btn.textContent = '↻ 重新整理'; }, 1500);
  } catch (e) { if (!quiet) $('#today').innerHTML = '<div class="none">讀不到資料，請稍後按右上角「重新整理」。</div>'; btn.textContent = '↻ 重新整理'; }
  btn.disabled = false; loading = false;
}

function render() { renderToday(); renderReview(); renderSched(); renderStats(); }

function renderToday() {
  const now = new Date(), tk = dayKey(now);
  const tm = new Date(now.getTime() + 864e5), mk = dayKey(tm);
  const items = sched().schedule || [];
  const line = (x) => `<div class="row"><span class="tm">${esc(x.at.slice(11, 16))}</span><span class="dot ${x.k}"></span><span class="t">${esc(clean(x.t))}</span></div>`;
  const td = items.filter((x) => x.at.slice(0, 10) === tk), tmr = items.filter((x) => x.at.slice(0, 10) === mk);
  const waiting = reviews().filter((x) => !(data.decisions || {})[x.id]).length;
  $('#today').innerHTML = `<div class="hd">今天 ${now.getMonth() + 1}/${now.getDate()}（${WD[now.getDay()]}）${waiting ? `・<b style="color:var(--fix)">${waiting} 篇等你審</b>` : '・沒有要你審的'}</div>
    ${td.length ? td.map(line).join('') : '<div class="none">今天沒有排發文</div>'}
    <div class="hd" style="margin-top:10px">明天 ${tm.getMonth() + 1}/${tm.getDate()}（${WD[tm.getDay()]}）</div>
    ${tmr.length ? tmr.map(line).join('') : '<div class="none">明天還沒有排</div>'}`;
  const fails = items.filter((x) => x.ck === 'fail');
  if (fails.length) $('#today').innerHTML += `<div class="alert">⚠️ ${fails.length} 篇沒發出去：${fails.map((x) => esc(x.at.slice(5, 10).replace('-', '/') + ' ' + clean(x.t).slice(0, 14))).join('、')}<br>到「交代」打「補發」，或叫 Claude 處理。</div>`;
  const b = $('#badge'); b.hidden = !waiting; b.textContent = waiting;
}

function renderReview() {
  const rv = reviews();
  if (!rv.length) { $('#list').innerHTML = '<div class="empty">目前沒有要審的文章 ✨<br>每晚 8:10 新稿做好會傳 LINE 通知你</div>'; return; }
  $('#list').innerHTML = rv.map((r, i) => {
    const d = (data.decisions || {})[r.id], st = d ? d.decision : 'wait';
    const tag = st === 'ok' ? '<span class="tag ok">已通過・等自動排程</span>' : st === 'fix' ? '<span class="tag fix">已退回・等 Claude 改</span>' : '<span class="tag wait">等你審</span>';
    const caps = r.caps || {}, n = (r.imgs || []).length;
    return `<article class="card" data-i="${i}">
      <h2>${esc(clean(r.title))}</h2>
      <div class="meta">預計 <b>${esc(r.when)}</b>・${r.kind === 'vid' ? '影片・FB／IG' : 'FB／IG／Threads'}</div>
      ${tag}
      <div class="imgs">${(r.imgs || []).map((src, k) => `<img src="${esc(src)}" alt="第 ${k + 1} 張圖" loading="lazy">`).join('')}</div>
      ${n > 1 ? `<div class="hint">${r.kind === 'vid' ? `影片畫面 ${n} 張` : `共 ${n} 張`}，左右滑 →</div>` : ''}
      <ul class="check">${(r.check || []).map((c) => `<li>${esc(c)}</li>`).join('')}</ul>
      ${['FB', 'IG', 'Threads'].filter((k) => caps[k]).filter((k, j, a) => !(k === 'IG' && caps.IG === caps.FB)).map((k) => `<details><summary>${k === 'FB' && caps.IG === caps.FB ? 'FB／IG' : k} 文案</summary><pre>${esc(caps[k])}</pre></details>`).join('')}
      <div class="btns"><button type="button" class="okb" data-act="ok"${st === 'ok' ? ' disabled' : ''}>${st === 'ok' ? '已通過 ✓' : '通過'}</button><button type="button" data-act="fix">要改</button></div>
      <div class="fixbox" hidden><textarea placeholder="哪裡要改？例如：第 3 張字太多、Threads 開頭換一句、換題目"></textarea><div class="btns"><button type="button" class="okb" data-act="sendfix">送出意見</button><button type="button" data-act="cancel">取消</button></div></div>
      ${st !== 'wait' ? '<div class="btns"><button type="button" class="ghost" data-act="clear">按錯了，撤回決定</button></div>' : ''}
      <div class="msg"></div>
    </article>`;
  }).join('');
}

function renderSched() {
  const items = sched().schedule || [];
  if (!items.length) { $('#sched').innerHTML = '<div class="empty">還沒有排程資料</div>'; return; }
  const tk = dayKey(new Date());
  const days = {};
  items.filter((x) => x.at.slice(0, 10) >= tk).forEach((x) => { (days[x.at.slice(0, 10)] = days[x.at.slice(0, 10)] || []).push(x); });
  let keys = Object.keys(days).sort();
  const hiddenN = keys.length > 7 && !showAll ? keys.length - 7 : 0;
  if (hiddenN) keys = keys.slice(0, 7);
  const th = { queued: ['Threads 已排', ''], posted: ['Threads 已發', 'good'], missed: ['Threads 沒發到', 'bad'], failed: ['Threads 失敗', 'bad'] };
  $('#sched').innerHTML = '<div class="legend"><span><span class="dot img"></span>圖文</span><span><span class="dot vid"></span>影片</span></div>' + keys.map((k) => {
    const d = new Date(k + 'T00:00:00'), isT = k === tk;
    return `<div class="dayhd${isT ? ' is-today' : ''}">${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）${isT ? '・今天' : ''}</div><div class="list">${days[k].map((x) => {
      const plats = x.p.filter((v) => v !== 'Threads').join('・');
      const t = x.k === 'img' && x.th ? th[x.th] || ['Threads', ''] : null;
      const ck = x.ck === 'ok' ? '<span class="ck-ok">✅ 確認有發</span>' : x.ck === 'fail' ? `<span class="ck-bad">❌ 沒發出去：${esc(x.ckn || '')}</span>` : (x.done ? '<span>已過・等確認</span>' : '');
      return `<div class="it${x.done && x.ck !== 'fail' ? ' done' : ''}"><span class="tm">${esc(x.at.slice(11, 16))}</span><div class="bd"><div class="tt"><span class="dot ${x.k}"></span>${esc(clean(x.t))}</div><div class="pl"><span>${esc(plats)}</span>${t ? `<span class="${t[1]}">${t[0]}</span>` : ''}${ck}</div></div></div>`;
    }).join('')}</div>`;
  }).join('') + (hiddenN ? `<button class="more" type="button" id="more">再看後面 ${hiddenN} 天</button>` : '');
}

function renderStats() {
  const st = sched().stats || {}, g = st.gbp, t = st.threads;
  const n = (x) => (x == null ? '—' : Number(x).toLocaleString('zh-TW'));
  let h = '';
  if (g) {
    const m = (g.months || []).slice(-1)[0] || {}, mm = m.m ? +m.m.slice(5) : '';
    const top = (g.platform || [])[0];
    h += `<section class="card"><h2>Google 商家</h2><div class="meta">客人怎麼找到店</div>
      <div class="kpis"><div class="kpi"><b>${g.rating ? g.rating.toFixed(1) + '★' : '—'}</b><span>${n(g.reviews)} 則評論${g.unreplied ? `・<b style="color:var(--fix);display:inline;font-size:inherit">${g.unreplied} 未回</b>` : ''}</span></div>
      <div class="kpi"><b>${n(m.dirs)}</b><span>${mm} 月查路線</span></div>
      <div class="kpi"><b>${n(m.calls)}</b><span>${mm} 月打電話</span></div></div>
      <div class="note2">${n(g.views)} 人看過商家檔案（${esc(g.viewsRange || '')}）${top ? `，${top[1]}% 來自${esc(top[0])}` : ''}</div>
      ${(g.terms || []).length ? `<div class="note2">大家搜尋：${g.terms.map(esc).join('、')}</div>` : ''}
      <div class="note2">資料 ${esc(g.asOf || '')}・每週一更新</div></section>`;
  }
  if (t) {
    const ps = (t.posts || []).slice().sort((a, b) => b.views - a.views);
    const tot = ps.reduce((a, b) => a + (b.views || 0), 0), mx = Math.max(1, ...ps.map((p) => p.views || 0));
    const hist = t.followerHist || [], grow = hist.length > 1 ? t.followers - hist[Math.max(0, hist.length - 8)][1] : null;
    h += `<section class="card"><h2>Threads</h2><div class="meta">${esc(t.range || '最近 7 天')}</div>
      <div class="kpis"><div class="kpi"><b>${n(t.followers)}</b><span>粉絲${grow != null ? `（${grow >= 0 ? '+' : ''}${grow}）` : ''}</span></div>
      <div class="kpi"><b>${n(ps.length)}</b><span>則貼文</span></div>
      <div class="kpi"><b>${n(tot)}</b><span>總觀看</span></div></div>
      <div class="sub-h">每則觀看（高到低，點標題打開）</div>
      ${ps.map((p) => `<div class="tp"><div style="flex:1;min-width:0"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.t)}</a><div class="bar"><i style="width:${Math.round((p.views || 0) / mx * 100)}%"></i></div></div><span class="v">${n(p.views)}</span></div>`).join('')}
      <div class="note2">更新 ${esc(t.asOf || '')}・每天早上更新</div></section>`;
  }
  const w = st.site;
  if (w) {
    const mx = Math.max(1, ...w.daily.map((d) => d[1]));
    const diff = (a, b) => (b ? `（前 7 天 ${n(b)}）` : '');
    h = `<section class="card"><h2>報價網站</h2><div class="meta">最近 7 天・不記錄個人資料</div>
      <div class="kpis"><div class="kpi"><b>${n(w.view)}</b><span>人瀏覽${diff(w.view, w.viewPrev)}</span></div>
      <div class="kpi"><b>${n(w.book)}</b><span>人按預約${diff(w.book, w.bookPrev)}</span></div>
      <div class="kpi"><b>${w.view ? Math.round(w.book / w.view * 100) + '%' : '—'}</b><span>預約率</span></div></div>
      <div style="display:flex;gap:6px;align-items:flex-end;height:64px;margin:10px 0 4px">${w.daily.map((d) => `<div style="flex:1;text-align:center;font-size:11px;color:var(--sub)"><div style="background:var(--accent);border-radius:4px 4px 0 0;height:${Math.max(2, Math.round(d[1] / mx * 44))}px;margin-bottom:3px" title="${d[1]}"></div>${esc(d[0].replace('-', '/'))}</div>`).join('')}</div>
      ${w.top.length ? `<div class="sub-h">最常查的機型</div>` + w.top.map((m) => `<div class="tp"><span>${esc(m[0])}</span><span class="v">${n(m[1])} 次</span></div>`).join('') : '<div class="note2">還沒有人查機型</div>'}
      <div class="note2">更新 ${esc(w.asOf || '')}</div></section>` + h;
  }
  const wb = st.web || {}, sc = wb.search || {};
  const wmx = Math.max(1, ...(wb.daily || []).map((d) => d[1]));
  const gcard = `<section class="card"><h2>官網搜尋與流量</h2><div class="meta">chiu189.com.tw・最近 7 天${wb.now ? `・<b style="color:var(--ok,#06c755);display:inline">現在 ${n(wb.now)} 人在看</b>` : ''}</div>
      ${wb.asOf ? `<div class="kpis"><div class="kpi"><b>${n(wb.users)}</b><span>人逛網站</span></div>
      <div class="kpi"><b>${n(wb.phone)}</b><span>按打電話</span></div>
      <div class="kpi"><b>${n(wb.line)}</b><span>按 LINE</span></div></div>
      ${(wb.daily || []).length ? `<div style="display:flex;gap:6px;align-items:flex-end;height:64px;margin:10px 0 4px">${wb.daily.map((d) => `<div style="flex:1;text-align:center;font-size:11px;color:var(--sub)"><div style="background:var(--accent);border-radius:4px 4px 0 0;height:${Math.max(2, Math.round(d[1] / wmx * 44))}px;margin-bottom:3px"></div>${esc(d[0])}</div>`).join('')}</div>` : ''}
      ${(wb.sources || []).length ? `<div class="sub-h">從哪裡來</div>` + wb.sources.map((x) => `<div class="tp"><span>${esc(x[0])}</span><span class="v">${n(x[1])} 次</span></div>`).join('') : ''}
      <div class="sub-h">Google 搜尋${sc.range ? `（${esc(sc.range)}）` : ''}</div>
      ${sc.error ? `<div class="note2">Search Console 暫時讀不到</div>` : `<div class="tp"><span>出現在搜尋結果</span><span class="v">${n(sc.impressions)} 次</span></div><div class="tp"><span>點進網站</span><span class="v">${n(sc.clicks)} 次</span></div>
      ${(sc.queries || []).length ? `<div class="note2">大家搜尋：${sc.queries.map((q) => esc(q[0]) + `（${n(q[1])}）`).join('、')}</div>` : '<div class="note2">還沒有搜尋資料（Search Console 會晚 2～3 天）</div>'}`}
      <div class="note2">更新 ${esc(wb.asOf)}・每 30 分鐘・GA 數字本身會晚幾小時</div>` : '<div class="note2">還沒有資料，電腦下次同步後會出現</div>'}
      </section>`;
  $('#stats').innerHTML = gcard + h;
}

async function decide(card, decision, note) {
  const r = reviews()[+card.dataset.i];
  const pin = getPin() || askPin();
  if (!pin) return;
  const msg = card.querySelector('.msg');
  card.querySelectorAll('button').forEach((b) => (b.disabled = true));
  msg.textContent = '存檔中…';
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: 'decide', id: r.id, decision, note: note || '', pin }) });
    const j = await res.json();
    if (!j.ok && j.error === 'pin') { setPin(''); msg.textContent = '密碼不對，請再按一次重新輸入。'; card.querySelectorAll('button').forEach((b) => (b.disabled = false)); return; }
    if (!j.ok) throw new Error(j.error);
    if (decision === 'clear') delete data.decisions[r.id]; else data.decisions[r.id] = { decision };
    renderToday(); renderReview();
    const m = document.querySelector(`.card[data-i="${card.dataset.i}"] .msg`);
    if (m) m.textContent = decision === 'ok' ? '已存好！晚上 9:30 或早上 10:00 會自動排程，排好傳 LINE 給你。' : decision === 'fix' ? '意見收到，Claude 改好會再傳 LINE 給你。' : '已撤回。';
  } catch (e) { msg.textContent = '沒存到，請再按一次。'; card.querySelectorAll('button').forEach((b) => (b.disabled = false)); }
}

$('#list').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const card = b.closest('.card'), act = b.dataset.act, box = card.querySelector('.fixbox');
  if (act === 'ok') decide(card, 'ok');
  else if (act === 'fix') { box.hidden = false; box.querySelector('textarea').focus(); }
  else if (act === 'cancel') box.hidden = true;
  else if (act === 'sendfix') { const t = box.querySelector('textarea').value.trim(); if (!t) { box.querySelector('textarea').focus(); return; } decide(card, 'fix', t); }
  else if (act === 'clear') decide(card, 'clear');
});
$('#sched').addEventListener('click', (e) => { if (e.target.id === 'more') { showAll = true; renderSched(); } });
document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) { setTab(b.dataset.tab); window.scrollTo({ top: 0 }); } });
async function askApi(body) {
  const pin = getPin() || askPin(); if (!pin) return null;
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pin }, body)) });
  const j = await res.json();
  if (!j.ok && j.error === 'pin') { setPin(''); throw new Error('pin'); }
  if (!j.ok) throw new Error(j.error);
  return j;
}
function renderAsk(list) {
  const st = { new: '等處理', done: '已處理', need_you: '要你處理' };
  $('#askList').innerHTML = (list || []).map((q) => `<div class="req"><div class="q">${esc(q.text)}</div>${q.reply ? `<div class="a">${esc(q.reply)}</div>` : ''}<div class="s">${new Date(q.at).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })}・${st[q.status] || q.status}</div></div>`).join('') || '<div class="empty">還沒有交代過事情</div>';
}
async function loadAsk() {
  $('#askList').innerHTML = '<div class="empty">載入中…</div>';
  try { const j = await askApi({ a: 'my_requests' }); if (j) renderAsk(j.requests); else $('#askList').innerHTML = '<div class="empty">輸入審稿密碼後才看得到</div>'; }
  catch (e) { $('#askList').innerHTML = e.message === 'pin' ? '<div class="empty">密碼不對，切換分頁再試一次</div>' : '<div class="empty">讀不到，請稍後再試</div>'; }
}
$('#askSend').addEventListener('click', async () => {
  const t = $('#askText').value.trim(); if (!t) { $('#askText').focus(); return; }
  $('#askSend').disabled = true; $('#askMsg').textContent = '送出中…';
  try { const j = await askApi({ a: 'ask', text: t }); if (j) { $('#askText').value = ''; $('#askMsg').textContent = '收到！12:20 或 20:40 處理，結果會傳 LINE。'; renderAsk(j.requests); } else $('#askMsg').textContent = ''; }
  catch (e) { $('#askMsg').textContent = e.message === 'pin' ? '密碼不對，請再按一次。' : '沒送出去，請再按一次。'; }
  $('#askSend').disabled = false;
});
let askLoaded = false;
$('#reload').addEventListener('click', () => load());
// 像 APP：切回這個畫面就自動更新；開著的時候每 5 分鐘更新一次
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastLoad > 30000) load(true); });
setInterval(() => { if (!document.hidden) load(true); }, 5 * 60 * 1000);
load();
</script>
