<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>預覽播放</title>
<style>
  :root { --bg: #000; --fg: #eee; --muted: #999; --accent: #4da3ff; --bad: #ff6b6b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px -apple-system, "PingFang TC", sans-serif; }
  body { display: flex; flex-direction: column; }
  video { flex: 1; width: 100%; min-height: 0; background: #000; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; align-items: center;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
  .st { width: 100%; text-align: center; font-size: 13px; color: var(--muted); }
  .st.bad { color: var(--bad); }
  a { color: var(--accent); text-decoration: none; }
  .msg { margin: auto; padding: 24px 16px; text-align: center; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<script>
// 2026-11-21：剪片預覽的 R2 播放連結放在 # 後面（不會送到伺服器）；只接受 R2 網址
// #b=<base64url>（新）或 #<encodeURIComponent>（舊）；iPhone 會不會先幫忙解碼 % 不一定，base64 不受影響
(function () {
  var h = location.hash.slice(1), u = '';
  try {
    if (h.indexOf('b=') === 0) { var s = h.slice(2).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; u = atob(s); }
    else u = decodeURIComponent(h);
  } catch (e) { u = ''; }
  var ok = /^https:\/\/[0-9a-f]{32}\.r2\.cloudflarestorage\.com\/[^\s"'<>]+$/.test(u);
  var back = '<br>預覽也在 iPhone「檔案」→ iCloud 雲碟 → 維修影片。<br><br><a href="./">回審稿頁</a>';
  if (!ok) { document.body.innerHTML = '<div class="msg">連結不對或已經過期。' + back + '</div>'; return; }
  var v = document.createElement('video');
  v.controls = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
  v.muted = true; v.autoplay = true; v.preload = 'auto'; v.src = u;   // iPhone 只准「靜音」自動播放；聲音按影片右下角喇叭開
  document.body.appendChild(v);
  var bar = document.createElement('div'); bar.className = 'bar';
  var st = document.createElement('div'); st.className = 'st'; st.textContent = '載入中…';
  bar.appendChild(st);
  bar.insertAdjacentHTML('beforeend', '<a href="./">← 回審稿頁</a>');
  var dl = document.createElement('a'); dl.href = u; dl.textContent = '跑不動？改用 Safari 開'; dl.target = '_blank'; dl.rel = 'noopener';
  bar.appendChild(dl);
  document.body.appendChild(bar);
  var say = function (t, bad) { st.textContent = t; st.className = 'st' + (bad ? ' bad' : ''); };
  v.addEventListener('loadedmetadata', function () { say('影片 ' + Math.round(v.duration) + ' 秒・靜音播放中，聲音按右下角喇叭'); });
  v.addEventListener('waiting', function () { say('緩衝中…'); });
  v.addEventListener('playing', function () { say('播放中・聲音按影片上的喇叭'); });
  v.addEventListener('error', function () {
    var c = v.error ? v.error.code : '?';
    say('影片打不開（錯誤 ' + c + (c === 4 ? '：連結過期或格式不支援' : c === 2 ? '：網路斷了' : '') + '）・可以試「改用 Safari 開」', true);
  });
  setTimeout(function () { if (v.readyState < 1 && !v.error) say('10 秒還沒載入：網路慢，或點「改用 Safari 開」試試', true); }, 10000);
  var p = v.play(); if (p && p.catch) p.catch(function () { say('點影片中間的 ▶︎ 開始播放'); });
})();
</script>
</body>
</html>
